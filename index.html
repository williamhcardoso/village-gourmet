function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function fmtMoneyTick(v) {
  if (Math.abs(v) >= 1000) return 'R$ ' + (v / 1000).toLocaleString('pt-BR', { maximumFractionDigits:1 }) + ' mil';
  return 'R$ ' + v.toLocaleString('pt-BR', { maximumFractionDigits:0 });
}
function truncar(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

function ChartCard({ title, subtitle, build, deps, height }) {
  const ref = useRef(null);
  useEffect(() => {
    if (!ref.current || typeof Chart === 'undefined') return;
    const chart = new Chart(ref.current.getContext('2d'), build());
    return () => chart.destroy();
  }, deps);
  return (
    <div style={{ background:'var(--card)', borderRadius:10, padding:'14px 16px', boxShadow:'0 1px 4px var(--shadow)', marginBottom:14 }}>
      <div style={{ fontWeight:700, fontSize:13, letterSpacing:.5, color:'var(--tx)' }}>{title}</div>
      {subtitle && <div style={{ fontSize:11, color:'var(--tx3)', marginTop:2 }}>{subtitle}</div>}
      <div style={{ height: height || 280, position:'relative', marginTop:10 }}>
        <canvas ref={ref} />
      </div>
    </div>
  );
}

function GraficosTab({ vendas, state, filtro, setFiltro, theme }) {
  const temMeses = mesesOrdenados(vendas).length > 0;
  const agg = agregarVendas(vendas, filtro.de, filtro.ate);
  const map = vendas.map || {};
  const aggKey = JSON.stringify([filtro.de, filtro.ate, (vendas.updatedAt || ''), theme]);

  const card = { background:'var(--card)', borderRadius:10, padding:'14px 16px', boxShadow:'0 1px 4px var(--shadow)', marginBottom:14 };

  if (!temMeses) {
    return (
      <div className="tab-content" style={{ padding:'12px 16px' }}>
        <div style={{ textAlign:'center', padding:'50px 20px', color:'var(--tx4)' }}>
          <div style={{ fontSize:40, marginBottom:8 }}>📉</div>
          <div>Sem dados para os gráficos. Importe os relatórios mensais na aba 💰 Vendas.</div>
        </div>
      </div>
    );
  }

  // Base comum dos gráficos (cores lidas das variáveis do tema no momento do build)
  const base = () => {
    const grid = cssVar('--ch-grid'), tick = cssVar('--ch-tick');
    return {
      responsive: true, maintainAspectRatio: false, animation: { duration: 300 },
      plugins: { legend: { display:false } },
      scales: {
        x: { grid: { color: grid }, ticks: { color: tick, font: { size: 11 } }, border: { color: grid } },
        y: { grid: { color: grid }, ticks: { color: tick, font: { size: 11 } }, border: { color: grid } },
      },
    };
  };

  // 1) Evolução mensal do faturamento
  const buildMensal = () => {
    const o = base();
    o.scales.y.ticks.callback = fmtMoneyTick;
    o.plugins.tooltip = { callbacks: { label: ctx => 'Faturamento: ' + fmt2(ctx.parsed.y) } };
    return {
      type: 'bar',
      data: {
        labels: agg.meses.map(m => fmtMes(m.mes)),
        datasets: [{ data: agg.meses.map(m => m.fat), backgroundColor: cssVar('--s1'), borderRadius: 4, maxBarThickness: 46 }],
      },
      options: o,
    };
  };

  // 2) Top 10 produtos por faturamento
  const top10 = agg.porProduto.slice(0, 10);
  const buildTop10 = () => {
    const o = base();
    o.indexAxis = 'y';
    o.scales.x.ticks.callback = fmtMoneyTick;
    o.plugins.tooltip = { callbacks: {
      title: items => top10[items[0].dataIndex].nome,
      label: ctx => 'Faturado: ' + fmt2(ctx.parsed.x) + ' · ' + top10[ctx.dataIndex].qtd.toLocaleString('pt-BR') + ' un',
    } };
    return {
      type: 'bar',
      data: {
        labels: top10.map(p => truncar(p.nome, 24)),
        datasets: [{ data: top10.map(p => p.fat), backgroundColor: cssVar('--s1'), borderRadius: 4, maxBarThickness: 22 }],
      },
      options: o,
    };
  };

  // 3) Curva ABC — participação individual (barras) × acumulada (linha), eixo único em %
  const abcN = Math.min(agg.porProduto.length, 15);
  const abc = agg.porProduto.slice(0, abcN);
  let acum = 0;
  const abcAcum = abc.map(p => { acum += p.fat; return agg.fatTotal > 0 ? acum / agg.fatTotal * 100 : 0; });
  const buildABC = () => {
    const o = base();
    o.scales.y.max = 100;
    o.scales.y.ticks.callback = v => v + '%';
    o.scales.x.ticks.maxRotation = 60; o.scales.x.ticks.minRotation = 45;
    o.plugins.legend = { display:true, labels: { color: cssVar('--ch-tick'), boxWidth: 12, font: { size: 11 } } };
    o.plugins.tooltip = { callbacks: {
      title: items => abc[items[0].dataIndex].nome,
      label: ctx => ctx.dataset.label + ': ' + ctx.parsed.y.toFixed(1) + '%',
    } };
    return {
      type: 'bar',
      data: {
        labels: abc.map(p => truncar(p.nome, 14)),
        datasets: [
          { label: 'Participação', data: abc.map(p => agg.fatTotal > 0 ? p.fat / agg.fatTotal * 100 : 0), backgroundColor: cssVar('--s1'), borderRadius: 4, maxBarThickness: 26, order: 2 },
          { label: 'Acumulado', data: abcAcum, type: 'line', borderColor: cssVar('--s2'), backgroundColor: cssVar('--s2'), borderWidth: 2, pointRadius: 3, tension: 0.2, order: 1 },
        ],
      },
      options: o,
    };
  };

  // 4) Faturamento por categoria (via ficha vinculada)
  const porCat = {};
  agg.porProduto.forEach(pr => {
    const fid = resolverVinculo(pr.cod, pr.nome, map, state);
    const d = fid ? fichaDef(fid, state) : null;
    const cat = d ? d.c : '— SEM VÍNCULO —';
    porCat[cat] = (porCat[cat] || 0) + pr.fat;
  });
  const cats = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  const buildCats = () => {
    const o = base();
    o.indexAxis = 'y';
    o.scales.x.ticks.callback = fmtMoneyTick;
    o.plugins.tooltip = { callbacks: { label: ctx => fmt2(ctx.parsed.x) + (agg.fatTotal > 0 ? ' (' + (cats[ctx.dataIndex][1] / agg.fatTotal * 100).toFixed(1) + '%)' : '') } };
    return {
      type: 'bar',
      data: {
        labels: cats.map(c => c[0]),
        datasets: [{ data: cats.map(c => c[1]), backgroundColor: cssVar('--s1'), borderRadius: 4, maxBarThickness: 22 }],
      },
      options: o,
    };
  };

  return (
    <div className="tab-content" style={{ padding:'12px 16px' }}>
      <div style={{ ...card, display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:10 }}>
        <FiltroMeses vendas={vendas} filtro={filtro} setFiltro={setFiltro} />
        <span style={{ fontSize:12, color:'var(--tx3)' }}>
          {agg.meses.length} mês(es) · {fmt2(agg.fatTotal)} faturados
        </span>
      </div>
      <div className="charts-grid">
        <ChartCard title="📆 FATURAMENTO POR MÊS" subtitle="Total faturado em cada mês importado"
          build={buildMensal} deps={[aggKey]} height={260} />
        <ChartCard title="🏆 TOP 10 PRODUTOS" subtitle="Maiores faturamentos do período"
          build={buildTop10} deps={[aggKey]} height={300} />
        <ChartCard title="📊 CURVA ABC" subtitle="Participação no faturamento — barras individuais, linha acumulada"
          build={buildABC} deps={[aggKey]} height={300} />
        <ChartCard title="🍽️ FATURAMENTO POR CATEGORIA" subtitle="Categorias das fichas vinculadas às vendas"
          build={buildCats} deps={[aggKey]} height={300} />
      </div>
    </div>
  );
}

const PIN = '4321';

function PinScreen({ onUnlock }) {
  const [digits, setDigits] = useState('');
  const [error, setError] = useState(false);

  const addDigit = (d) => {
    if (digits.length >= 4 || error) return;
    const next = digits + d;
    setDigits(next);
    if (next.length === 4) {
      if (next === PIN) {
        sessionStorage.setItem('vg_auth', '1');
        onUnlock();
      } else {
        setError(true);
        setTimeout(() => { setDigits(''); setError(false); }, 800);
      }
    }
  };

  const del = () => { if (!error) setDigits(d => d.slice(0, -1)); };

  const keys = [1,2,3,4,5,6,7,8,9,'',0,'⌫'];

  return (
    <div style={{
      minHeight:'100vh', background:'var(--shell)', display:'flex', flexDirection:'column',
      alignItems:'center', justifyContent:'center', padding:24,
    }}>
      <div style={{ marginBottom:40, textAlign:'center' }}>
        <div style={{ fontSize:28, fontWeight:700, letterSpacing:-0.5 }}>
          Village <span style={{ color:'var(--gold)' }}>Gourmet</span>
        </div>
        <div style={{ fontSize:13, color:'var(--tx3)', marginTop:6 }}>Controle de Custos</div>
      </div>

      <div style={{ marginBottom:8, fontSize:13, color:'var(--tx3)', fontWeight:500 }}>Digite o PIN</div>

      <div style={{ display:'flex', gap:18, marginBottom:10 }}>
        {[0,1,2,3].map(i => (
          <div key={i} style={{
            width:14, height:14, borderRadius:'50%',
            background: digits.length > i ? (error ? 'var(--red)' : 'var(--gold)') : 'var(--inp-line)',
            transition:'background .15s',
          }} />
        ))}
      </div>

      <div style={{ height:20, marginBottom:16, textAlign:'center' }}>
        {error && <span style={{ fontSize:13, color:'var(--red)', fontWeight:600 }}>PIN incorreto</span>}
      </div>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(3, 76px)', gap:12 }}>
        {keys.map((k, i) => {
          if (k === '') return <div key={i} />;
          const isDel = k === '⌫';
          return (
            <button key={i} onClick={() => isDel ? del() : addDigit(String(k))} style={{
              height:76, borderRadius:38, fontSize: isDel ? 22 : 26, fontWeight:600,
              background: isDel ? 'transparent' : 'var(--card)',
              color: isDel ? 'var(--tx3)' : 'var(--tx)',
              border: isDel ? 'none' : '1px solid var(--soft)',
              boxShadow: isDel ? 'none' : '0 2px 8px rgba(0,0,0,0.07)',
              cursor:'pointer', WebkitTapHighlightColor:'transparent',
            }}>{k}</button>
          );
        })}
      </div>
    </div>
  );
}

// ─── APP PRINCIPAL ────────────────────────────────────────────────────────────
function App() {
  const [unlocked, setUnlocked] = useState(() => sessionStorage.getItem('vg_auth') === '1');
  const [state, setState] = useState(() => migrate(loadLS()));
  const [savedState, setSavedState] = useState(() => migrate(loadLS()));
  const [tab, setTab] = useState('insumos');
  const [syncStatus, setSyncStatus] = useState('idle');
  const [lastSync, setLastSync] = useState(null);
  const [dirty, setDirty] = useState(() => isDirtyLS());
  const [confirmCancel, setConfirmCancel] = useState(false);
  const [conflito, setConflito] = useState(null);   // payload aguardando decisão de conflito
  const baselineRef = useRef(null);                 // updatedAt do remoto quando carregamos
  const [theme, setTheme] = useState(() => document.documentElement.getAttribute('data-theme') || 'light');
  const [vendasData, setVendasData] = useState(() => loadVendasLS() || emptyVendas());
  const [vendasStatus, setVendasStatus] = useState('idle');
  const [filtroVendas, setFiltroVendas] = useState({ de:'', ate:'' });

  const toggleTheme = useCallback(() => {
    setTheme(t => {
      const next = t === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      try { localStorage.setItem(LS_THEME, next); } catch {}
      return next;
    });
  }, []);

  // Carrega as vendas importadas do bin próprio (separado dos dados das fichas).
  // Se o local for mais novo que o remoto (um salvamento falhou antes), reenvia o local.
  useEffect(() => {
    setVendasStatus('loading');
    fetch(VENDAS_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(data => {
        const remote = data && data.record && data.record.vendas;
        const local = loadVendasLS();
        if (local && local.updatedAt && (!remote || !remote.updatedAt || local.updatedAt > remote.updatedAt)) {
          saveVendas(local);
        } else if (remote && remote.meses) {
          setVendasData(remote);
          saveVendasLS(remote);
          setVendasStatus('synced');
        } else {
          setVendasStatus('idle');
        }
      })
      .catch(() => setVendasStatus('offline'));
  }, []);

  // Toda mutação de vendas salva imediatamente no bin (localStorage como fallback)
  const saveVendas = useCallback(next => {
    const payload = { ...next, updatedAt: new Date().toISOString() };
    setVendasData(payload);
    saveVendasLS(payload);
    setVendasStatus('saving');
    fetch(VENDAS_URL, {
      method: 'PUT',
      headers: { 'X-Master-Key': API_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ vendas: payload }),
    })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(() => setVendasStatus('synced'))
      .catch(() => setVendasStatus('error'));
  }, []);

  const importarMesVendas = useCallback(parsed => {
    saveVendas({
      ...vendasData,
      meses: { ...(vendasData.meses || {}), [parsed.mes]: { de: parsed.de, ate: parsed.ate, importadoEm: new Date().toISOString(), rows: parsed.rows } },
    });
  }, [vendasData, saveVendas]);

  const excluirMesVendas = useCallback(mes => {
    const meses = { ...(vendasData.meses || {}) };
    delete meses[mes];
    saveVendas({ ...vendasData, meses });
  }, [vendasData, saveVendas]);

  const setVinculoVenda = useCallback((cod, fid) => {
    saveVendas({ ...vendasData, map: { ...(vendasData.map || {}), [cod]: fid } });
  }, [vendasData, saveVendas]);

  // Carregar do JSONBin na inicialização — sem sobrescrever edições locais não salvas
  useEffect(() => {
    setSyncStatus('loading');
    fetch(API_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(data => {
        if (data && data.record && data.record.vg) {
          const remote = migrate(data.record.vg);
          baselineRef.current = data.record.vg.updatedAt || null;
          if (isDirtyLS()) {
            // Há edições locais não sincronizadas: preserva o trabalho local
            setDirty(true);
            setSyncStatus('idle');
          } else {
            setState(remote);
            setSavedState(remote);
            saveLS(remote);
            setLastSync(new Date());
            setSyncStatus('synced');
          }
        } else {
          setSyncStatus('idle');
        }
      })
      .catch(() => setSyncStatus('offline'));
  }, []);

  // Aviso do navegador ao fechar com alterações não salvas
  useEffect(() => {
    const h = e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } };
    window.addEventListener('beforeunload', h);
    return () => window.removeEventListener('beforeunload', h);
  }, [dirty]);

  const doPut = useCallback(payload => {
    return fetch(API_URL, {
      method: 'PUT',
      headers: { 'X-Master-Key': API_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ vg: payload }),
    })
      .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(() => {
        baselineRef.current = payload.updatedAt;
        setState(payload);
        setSavedState(payload);
        saveLS(payload);
        clearDirtyLS();
        setDirty(false);
        setLastSync(new Date());
        setSyncStatus('synced');
      })
      .catch(() => setSyncStatus('error')); // dirty permanece true: nada foi confirmado no servidor
  }, []);

  const handleSave = useCallback(() => {
    if (syncStatus === 'saving') return;
    setSyncStatus('saving');
    const payload = { ...withHist(state), updatedAt: new Date().toISOString() };
    // Detecta se outro usuário salvou depois que carregamos
    fetch(API_URL + '/latest', { headers: { 'X-Master-Key': API_KEY } })
      .then(r => (r.ok ? r.json() : null))
      .then(data => {
        const remoteAt = data && data.record && data.record.vg && data.record.vg.updatedAt;
        if (remoteAt && baselineRef.current && remoteAt !== baselineRef.current) {
          setSyncStatus('idle');
          setConflito({ payload, remote: data.record.vg });
          return;
        }
        return doPut(payload);
      })
      .catch(() => doPut(payload));
  }, [state, syncStatus, doPut]);

  const handleCancel = useCallback(() => {
    if (!dirty) return;
    setConfirmCancel(true);
  }, [dirty]);

  const handleConfirmCancel = useCallback(() => {
    setState(savedState);
    saveLS(savedState);
    clearDirtyLS();
    setDirty(false);
    setConfirmCancel(false);
  }, [savedState]);

  const touch = next => { saveLS(next); markDirtyLS(); };

  const updateInsumo = useCallback((id, field, value) => {
    setState(prev => {
      const atual = { ...(prev.insumos || {})[id], [field]: value };
      if (field === 'preco') atual.precoAt = hoje();
      const next = { ...prev, insumos: { ...prev.insumos, [id]: atual } };
      touch(next);
      return next;
    });
    setDirty(true);
  }, []);

  const updateFicha = useCallback((fid, key, val) => {
    setState(prev => {
      const next = {
        ...prev,
        fichas: { ...prev.fichas, [fid]: { ...(prev.fichas || {})[fid], [key]: val } },
      };
      touch(next);
      return next;
    });
    setDirty(true);
  }, []);

  const updateGestao = useCallback((field, val) => {
    setState(prev => {
      const next = { ...prev, gestao: { ...(prev.gestao || {}), [field]: val } };
      touch(next);
      return next;
    });
    setDirty(true);
  }, []);

  const saveCustomInsumo = useCallback(ins => {
    setState(prev => {
      const list = [...((prev.custom || {}).insumos || [])];
      const ix = list.findIndex(x => x.id === ins.id);
      if (ix >= 0) list[ix] = ins; else list.push(ins);
      const next = { ...prev, custom: { ...(prev.custom || {}), insumos: list } };
      touch(next);
      return next;
    });
    setDirty(true);
  }, []);

  const deleteCustomInsumo = useCallback(id => {
    setState(prev => {
      const insumos = { ...prev.insumos };
      delete insumos[id];
      const next = {
        ...prev,
        insumos,
        custom: { ...(prev.custom || {}), insumos: ((prev.custom || {}).insumos || []).filter(x => x.id !== id) },
      };
      touch(next);
      return next;
    });
    setDirty(true);
  }, []);

  const saveCustomFicha = useCallback(fic => {
    setState(prev => {
      const list = [...((prev.custom || {}).fichas || [])];
      const ix = list.findIndex(x => x.id === fic.id);
      if (ix >= 0) list[ix] = fic; else list.push(fic);
      const next = { ...prev, custom: { ...(prev.custom || {}), fichas: list } };
      touch(next);
      return next;
    });
    setDirty(true);
  }, []);

  const deleteCustomFicha = useCallback(fid => {
    setState(prev => {
      const fichas = { ...prev.fichas };
      delete fichas[fid];
      const gestao = { ...(prev.gestao || {}) };
      if (gestao.vendas && gestao.vendas[fid] !== undefined) {
        gestao.vendas = { ...gestao.vendas };
        delete gestao.vendas[fid];
      }
      const next = {
        ...prev,
        fichas,
        gestao,
        custom: { ...(prev.custom || {}), fichas: ((prev.custom || {}).fichas || []).filter(x => x.id !== fid) },
      };
      touch(next);
      return next;
    });
    setDirty(true);
  }, []);

  const handleImport = useCallback(dados => {
    const next = migrate(dados);
    setState(next);
    touch(next);
    setDirty(true);
  }, []);

  const handleExport = useCallback(() => exportExcel(state), [state]);

  const todosInsumos = getInsumos(state);
  const filled = todosInsumos.filter(ins => parsePreco(((state.insumos || {})[ins.id] || {}).preco) > 0).length;
  const progress = Math.round(filled / todosInsumos.length * 100);

  if (!unlocked) return <PinScreen onUnlock={() => setUnlocked(true)} />;

  return (
    <div className="app-shell">
      <Header tab={tab} setTab={setTab} syncStatus={syncStatus} progress={progress} theme={theme} onToggleTheme={toggleTheme} />
      <main style={{ flex:1, paddingBottom:90 }}>
        {tab === 'insumos' && (
          <InsumosTab
            state={state} updateInsumo={updateInsumo}
            saveCustomInsumo={saveCustomInsumo} deleteCustomInsumo={deleteCustomInsumo}
          />
        )}
        {tab === 'fichas' && (
          <FichasTab
            state={state} updateFicha={updateFicha}
            saveCustomFicha={saveCustomFicha} deleteCustomFicha={deleteCustomFicha}
          />
        )}
        {tab === 'resumo' && <ResumoTab state={state} />}
        {tab === 'vendas' && (
          <VendasTab
            vendas={vendasData} vendasStatus={vendasStatus} state={state}
            filtro={filtroVendas} setFiltro={setFiltroVendas}
            onImportMes={importarMesVendas} onDeleteMes={excluirMesVendas} onSetVinculo={setVinculoVenda}
          />
        )}
        {tab === 'graficos' && (
          <GraficosTab
            vendas={vendasData} state={state}
            filtro={filtroVendas} setFiltro={setFiltroVendas} theme={theme}
          />
        )}
        {tab === 'gestao' && <GestaoTab state={state} updateGestao={updateGestao} onImport={handleImport} />}
      </main>
      <Footer
        onSave={handleSave} onCancel={handleCancel} onExport={handleExport}
        dirty={dirty} lastSync={lastSync} syncStatus={syncStatus}
      />
      {confirmCancel && (
        <ConfirmModal
          message="Descartar todas as alterações não salvas?"
          onConfirm={handleConfirmCancel}
          onCancel={() => setConfirmCancel(false)}
        />
      )}
      {conflito && (
        <ConfirmModal
          message="⚠️ Outro usuário salvou alterações no servidor depois que você abriu o app. Sobrescrever com os SEUS dados? (Para manter os dados do outro usuário, escolha Não e recarregue a página.)"
          okLabel="Sobrescrever"
          onConfirm={() => { const p = conflito.payload; setConflito(null); setSyncStatus('saving'); doPut(p); }}
          onCancel={() => setConflito(null)}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
