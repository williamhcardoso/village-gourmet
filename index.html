  <script>
    // Aplica o tema salvo antes do primeiro paint (evita flash de tema errado)
    (function(){
      try {
        var t = localStorage.getItem('vg5_theme');
        if (!t) t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
      } catch(e) { document.documentElement.setAttribute('data-theme', 'light'); }
    })();
  </script>

    /* ── Variáveis de tema ─────────────────────────────────────────────── */
    :root {

      --shell: #f5f2ee;         /* fundo do app */
      --card: #ffffff;          /* cartões, header, footer, modais */
      --soft: #f0ede9;          /* bordas e fundos suaves (grupos, botões secundários) */
      --line-soft: #f7f5f2;     /* divisores de linha */
      --inp-bg: #fafafa;        /* fundo de inputs */
      --inp-line: #dddddd;      /* borda de inputs */
      --box: #f8f6f3;           /* caixas de métrica */
      --tx: #0f0f0f;            /* texto principal */
      --tx1: #333333;           /* texto forte */
      --tx2: #606060;           /* texto médio */
      --tx3: #888888;           /* rótulos */
      --tx4: #ababab;           /* texto apagado */
      --gold: #c9973a;
      --green: #1e8449;
      --red: #c0392b;
      --amber: #856404;

      --tx: #f2f1ec;
      --tx1: #d9d7d0;
      --tx2: #b3b1a8;
      --tx3: #92908a;
      --tx4: #6d6c66;
      --gold: #d5a54c;
      --green: #43b476;
      --red: #e26a5c;
      --amber: #d9b45c;
      --on-accent: #171712;
      --ok-bg: #1c3a26;  --ok-tx: #8fd9a5;
      --err-bg: #442522; --err-line: #6a3a35; --err-tx: #f1a79e;
      --warn-bg: #3a3113; --warn-line: #63541f;
      --filled: #20301f;
      --shadow: rgba(0,0,0,0.45);
      --overlay: rgba(0,0,0,0.65);
      --ch-grid: #2c2c2a; --ch-tick: #898781;
      --s1: #3987e5; --s2: #d95926;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--tx); }
    #root { display: flex; flex-direction: column; min-height: 100vh; }
    input, select, button, textarea { font-family: inherit; }
    input, select { color-scheme: light; }
    html[data-theme="dark"] input, html[data-theme="dark"] select { color-scheme: dark; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
    button { cursor: pointer; border: none; outline: none; }
    input:focus, select:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: #c9973a55; border-radius: 4px; }

    /* ── Layout responsivo ─────────────────────────────────────────────── */
    .app-shell {
      display: flex; flex-direction: column; min-height: 100vh;
      max-width: 640px; margin: 0 auto;
      background: var(--shell);
      box-shadow: 0 0 40px rgba(0,0,0,0.12);
    }
    .footer-wrap {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 640px; z-index: 100;
      background: var(--card); border-top: 1px solid var(--soft);
      box-shadow: 0 -2px 12px var(--shadow);
    }

    /* Grid de 2 colunas para insumos em telas maiores */
    @media (min-width: 540px) {
      .insumos-grid { display: grid; grid-template-columns: 1fr 1fr; }
    }

    /* Desktop: shell amplo, conteúdo em grades */
    @media (min-width: 900px) {
      .app-shell, .footer-wrap { max-width: 1240px; }
      .insumos-grid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
      .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 2px; align-items: start; background: var(--line-soft); }
      .resumo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; align-items: start; }
      .resumo-grid > div { margin-bottom: 0 !important; }
      .gestao-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
      .gestao-grid > div { margin-bottom: 0 !important; }
      .kpi-row { grid-template-columns: repeat(4, 1fr) !important; }
      .charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
      .charts-grid > div { margin-bottom: 0 !important; }
      .tab-content { padding-left: 24px !important; padding-right: 24px !important; }
    }
  </style>
</head>

function parsePreco(v) { return parseFloat(String(v == null ? '' : v).replace(',', '.')) || 0; }

function getInsumos(state) { return INSUMOS.concat((state.custom && state.custom.insumos) || []); }
function getInsumoDef(id, state) { return getInsumos(state).find(i => i.id === id) || null; }
function getFichaIds(state) {
  return FIC.map((f, i) => 'b' + i).concat(((state.custom && state.custom.fichas) || []).map(f => f.id));
}
function fichaDef(fid, state) {
  const s = String(fid == null ? '' : fid);
  if (s[0] === 'b' && /^\d+$/.test(s.slice(1))) return FIC[parseInt(s.slice(1))] || null;
  return ((state.custom && state.custom.fichas) || []).find(f => f.id === fid) || null;
}

// ─── CONVERSÃO DE UNIDADES E CUSTO-BASE ───────────────────────────────────────
function qtyToBase(q, unid, base) {
  const c = CONV[unid];
  if (!c || !base) return q;
  if (c.b === base) return q * c.f;
  if ((c.b === 'g' && base === 'ml') || (c.b === 'ml' && base === 'g')) return q * c.f; // densidade ≈ 1
  return q; // un ↔ massa/volume: sem conversão possível
}
function conteudoPadrao(ins, unid) {
  if (unid === ins.u) return ins.f;
  if (ins.b === 'g' && unid === 'kg') return 1000;
  if (ins.b === 'g' && unid === 'g') return 1;
  if (ins.b === 'ml' && unid === 'L') return 1000;
  if (ins.b === 'ml' && unid === 'ml') return 1;
  if (unid === 'duzia') return 12;
  if (unid === 'unidade') return 1;
  return ins.f;
}
function conteudoEfetivo(ins, sv) {
  const unid = sv.unid || ins.u;
  let cont = parsePreco(sv.conteudo);
  if (!cont && unid === 'caixa') cont = parseInt(sv.qtd_caixa) || 0;
  return cont > 0 ? cont : conteudoPadrao(ins, unid);
}
function rendEfetivo(sv) {
  const r = parsePreco(sv.rend);
  return r > 0 && r <= 100 ? r : 100;
}

// Custo por unidade-base (g/ml/un) considerando conteúdo da embalagem e rendimento (fator de correção)
function custoBase(id, state) {
  const ins = getInsumoDef(id, state);
  if (!ins) return 0;
  const sv = (state.insumos || {})[id] || {};
  const preco = parsePreco(sv.preco);
  if (!preco) return 0;
  const cont = conteudoEfetivo(ins, sv);
  if (cont <= 0) return 0;
  return (preco / cont) / (rendEfetivo(sv) / 100);
}

// Custo de uma sub-receita por unidade-base do seu rendimento
function custoSubReceita(fid, state, depth) {
  const f = fichaDef(fid, state);
  if (!f || !f.sub) return 0;
  const rq = parsePreco(f.rendQ);
  if (rq <= 0) return 0;
  const r = calcFicha(fid, state, (depth || 0) + 1);
  return r.calculado ? r.total / rq : 0;
}

// Custo de um ingrediente: custo manual > sub-receita > insumo referenciado
function calcIng(fid, ii, state, depth) {
  const ficha = fichaDef(fid, state);
  if (!ficha || !ficha.i[ii]) return { q: 0, unid: '', custo: 0, manual: false };
  const ing = ficha.i[ii];
  const si = ((state.fichas || {})[fid] || {})['i' + ii] || {};
  const rawQ = si.qtd !== undefined ? si.qtd : (ing.q != null ? String(ing.q) : '');
  const q = parsePreco(rawQ);
  const unid = si.unid || ing.u;
  const manual = parsePreco(si.custo);
  if (manual > 0) return { q, unid, custo: manual, manual: true };
  if (!ing.r || q <= 0) return { q, unid, custo: 0, manual: false };
  if (String(ing.r).slice(0, 2) === 'f:') {
    if ((depth || 0) >= 3) return { q, unid, custo: 0, manual: false };
    const sid = String(ing.r).slice(2);
    const sdef = fichaDef(sid, state);
    const cb = custoSubReceita(sid, state, depth);
    return { q, unid, custo: qtyToBase(q, unid, sdef ? sdef.rendU : null) * cb, manual: false };
  }
  const ins = getInsumoDef(ing.r, state);
  return { q, unid, custo: qtyToBase(q, unid, ins ? ins.b : null) * custoBase(ing.r, state), manual: false };
}

function calcFicha(fid, state, depth) {
  const vazio = { total:0, custoIns:0, mb:0, ml:0, pmin:0, pdes:0, calculado:false, completo:0, nIng:0, comCusto:0, p:0, m:0, a:0, emb:0 };
  const ficha = fichaDef(fid, state);
  if (!ficha) return vazio;
  const sf = (state.fichas || {})[fid] || {};
  let custoIns = 0, comCusto = 0;
  ficha.i.forEach((ing, ii) => {
    const r = calcIng(fid, ii, state, depth);
    if (r.custo > 0) comCusto++;
    custoIns += r.custo;
  });
  const p = parsePreco(sf.p) || ficha.p || 0;
  const m = parsePreco(sf.m) > 0 ? parsePreco(sf.m) / 100 : (ficha.m || 0);
  const a = sf.a !== undefined && sf.a !== '' ? parseFloat(sf.a) : (ficha.a || 0);
  const emb = parsePreco(sf.emb);
  const g = state.gestao || {};
  const varPct = a + parsePreco(g.cartao) / 100 + parsePreco(g.outros) / 100;
  const total = custoIns + emb;
  const nIng = ficha.i.length;
  const completo = nIng ? comCusto / nIng : 0;
  const calculado = comCusto > 0 && total > 0;
  if (!calculado) return { ...vazio, p, m, a, emb, nIng };
  if (ficha.sub || p <= 0) return { total, custoIns, mb:0, ml:0, pmin:0, pdes:0, calculado, completo, nIng, comCusto, p, m, a, emb };
  const mb = (p - total) / p;
  const ml = (p - total - p * varPct) / p;
  const dmin = 1 - m - varPct, ddes = 1 - (m + 0.05) - varPct;
  return { total, custoIns, mb, ml, pmin: dmin > 0.02 ? total / dmin : 0, pdes: ddes > 0.02 ? total / ddes : 0, calculado, completo, nIng, comCusto, p, m, a, emb };
}

// Resumo agregado das vendas lançadas no período (usado no rateio e na aba Gestão)
function calcVendasResumo(state) {
  const g = state.gestao || {};
  const vendas = g.vendas || {};
  const rows = getFichaIds(state)
    .map(fid => ({ fid, d: fichaDef(fid, state) }))
    .filter(x => x.d && !x.d.sub)
    .map(x => ({ ...x, calc: calcFicha(x.fid, state), q: parsePreco(vendas[x.fid]) }));
  const vend = rows.filter(x => x.q > 0);
  const fat = vend.reduce((s, x) => s + x.q * x.calc.p, 0);
  const vendComFicha = vend.filter(x => x.calc.calculado);
  const cmvT = vendComFicha.reduce((s, x) => s + x.q * x.calc.total, 0);
  const fatComFicha = vendComFicha.reduce((s, x) => s + x.q * x.calc.p, 0);
  const cmvPct = fatComFicha > 0 ? cmvT / fatComFicha : 0;
  const semFicha = vend.length - vendComFicha.length;
  return { rows, vend, fat, vendComFicha, cmvT, fatComFicha, cmvPct, semFicha };
}

// Rateio dos custos indiretos (fixos) proporcional ao CARDÁPIO (decisão do usuário),
// usando o custo fixo DIÁRIO (mensal ÷ 30):
//   participação = preço_do_produto ÷ soma dos preços de todos os produtos
//   rateio_do_produto = (custos_fixos ÷ 30) × participação  (= preço × índice)
//   índice = (custos_fixos ÷ 30) ÷ soma dos preços do cardápio
// Não depende de faturamento nem de vendas — as fatias somam 100% do fixo diário.
function calcRateioFixo(state) {
  const g = state.gestao || {};
  const custosFixos = ['aluguel', 'energia', 'deprec', 'folha', 'outrosFixos']
    .reduce((s, k) => s + parsePreco(g[k]), 0);
  const custosFixosDia = custosFixos / 30;
  const somaPrecos = getFichaIds(state)
    .map(fid => ({ def: fichaDef(fid, state), calc: calcFicha(fid, state) }))
    .filter(x => x.def && !x.def.sub && x.calc.p > 0)
    .reduce((s, x) => s + x.calc.p, 0);
  const indiceRateio = somaPrecos > 0 ? custosFixosDia / somaPrecos : 0;
  return { custosFixos, custosFixosDia, somaPrecos, indiceRateio };
}

// Acrescenta ao histórico os insumos cujo preço mudou desde o último registro
function withHist(s) {
  const insumos = { ...s.insumos };
  Object.keys(insumos).forEach(id => {
    const sv = insumos[id] || {};
    const p = parsePreco(sv.preco);
    if (p > 0) {
      const hist = sv.hist || [];
      const last = hist[hist.length - 1];
      if (!last || Math.abs(last.p - p) > 0.0001) insumos[id] = { ...sv, hist: [...hist, { d: hoje(), p }].slice(-20) };
    }
  });
  return { ...s, insumos };
}

// "7.069,91" → 7069.91 · "598,00" → 598
function parseNumBR(s) {
  const v = parseFloat(String(s == null ? '' : s).trim().replace(/\./g, '').replace(',', '.'));
  return isNaN(v) ? 0 : v;
}
function stripTags(s) { return String(s).replace(/<[^>]*>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&amp;/g, '&').replace(/\s+/g, ' ').trim(); }
function dataBRparaISO(d) { const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(String(d).trim()); return m ? m[3] + '-' + m[2] + '-' + m[1] : null; }

// Parseia o relatório (HTML) exportado pelo sistema. Retorna { ok, erro?, de, ate, mes, rows }
function parseRelatorioVendas(html) {
  const txt = String(html || '');
  const per = /de\s+(\d{2}\/\d{2}\/\d{4})\s+at[ée]\s+(\d{2}\/\d{2}\/\d{4})/i.exec(stripTags(txt));
  if (!per) return { ok:false, erro:'Período não encontrado no título — o arquivo é o relatório "Vendas por Produto" exportado pelo sistema?' };
  const de = dataBRparaISO(per[1]), ate = dataBRparaISO(per[2]);
  const rows = [];
  const reTr = /<tr[^>]*>([\s\S]*?)<\/tr>/gi;
  let mTr;
  while ((mTr = reTr.exec(txt)) !== null) {
    const cells = [];
    const reTd = /<td[^>]*>([\s\S]*?)<\/td>/gi;
    let mTd;
    while ((mTd = reTd.exec(mTr[1])) !== null) cells.push(stripTags(mTd[1]));
    if (cells.length < 5) continue;              // cabeçalhos usam <th>
    const nome = cells[1];
    if (!nome) continue;
    // cells[3] = Custo — ignorada de propósito (não reflete a realidade)
    rows.push({ cod: cells[0], nome, qtd: parseNumBR(cells[2]), fat: parseNumBR(cells[4]) });
  }
  if (!rows.length) return { ok:false, erro:'Nenhuma linha de produto encontrada no arquivo.' };
  return { ok:true, de, ate, mes: de.slice(0, 7), rows };
}

// ── Vínculo venda ↔ ficha técnica (por nome, com ajuste manual por código) ────
function normNome(s) {
  return String(s || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/(\d)([a-z])/g, '$1 $2').replace(/([a-z])(\d)/g, '$1 $2')
    .replace(/[^a-z0-9]+/g, ' ').trim();
}
const STOPWORDS_NOME = { de:1, da:1, do:1, das:1, dos:1, com:1, e:1, o:1, a:1 };
function tokensNome(s) { return normNome(s).split(' ').filter(t => t && !STOPWORDS_NOME[t]); }

// Sugere a ficha mais parecida com o nome vindo do PDV (null se nada confiável).
// Pontuação: similaridade de Jaccard entre os conjuntos de tokens; se TODOS os
// tokens do lado menor estão contidos no maior (containment), garante 0.7 —
// cobre casos como "Batata dos Deuses (cheddar e bacon)" → "Batata dos Deuses".
function sugerirFichaId(nome, state) {
  const alvo = tokensNome(nome);
  if (!alvo.length) return null;
  const alvoSet = {};
  alvo.forEach(t => { alvoSet[t] = 1; });
  const nAlvo = Object.keys(alvoSet).length;
  let melhor = null, melhorScore = 0;
  getFichaIds(state).forEach(fid => {
    const d = fichaDef(fid, state);
    if (!d || d.sub) return;
    const ts = tokensNome(d.n);
    if (!ts.length) return;
    let inter = 0;
    const uniao = { ...alvoSet };
    const tsSet = {};
    ts.forEach(t => { tsSet[t] = 1; uniao[t] = 1; });
    Object.keys(tsSet).forEach(t => { if (alvoSet[t]) inter++; });
    const jaccard = inter / Object.keys(uniao).length;
    const cont = inter / Math.min(nAlvo, Object.keys(tsSet).length);
    const score = Math.max(jaccard, cont >= 1 ? 0.7 : 0);
    if (score > melhorScore) { melhorScore = score; melhor = fid; }
  });
  return melhorScore >= 0.6 ? melhor : null;
}

// Resolve o vínculo de um produto vendido: ajuste manual (map[cod]) tem precedência.
// map[cod] === '' significa "sem vínculo" escolhido pelo usuário.
function resolverVinculo(cod, nome, map, state) {
  const m = (map || {})[cod];
  if (m !== undefined) return m === '' ? null : (fichaDef(m, state) ? m : null);
  return sugerirFichaId(nome, state);
}

// ── Agregação com filtro por meses (de/até inclusivos, formato 'AAAA-MM') ────
function mesesOrdenados(vendasData) {
  return Object.keys((vendasData || {}).meses || {}).sort();
}
function fmtMes(m) {
  const nomes = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
  const p = String(m || '').split('-');
  return p.length === 2 ? nomes[parseInt(p[1], 10) - 1] + '/' + p[0] : String(m);
}
function agregarVendas(vendasData, deMes, ateMes) {
  const meses = (vendasData || {}).meses || {};
  const keys = Object.keys(meses).sort().filter(m => (!deMes || m >= deMes) && (!ateMes || m <= ateMes));
  const porCod = {};
  const porMes = [];
  keys.forEach(m => {
    const dados = meses[m] || {};
    let fatM = 0, qtdM = 0;
    (dados.rows || []).forEach(r => {
      fatM += r.fat; qtdM += r.qtd;
      const c = porCod[r.cod] || (porCod[r.cod] = { cod: r.cod, nome: r.nome, qtd: 0, fat: 0 });
      c.nome = r.nome;
      c.qtd += r.qtd; c.fat += r.fat;
    });
    porMes.push({ mes: m, de: dados.de, ate: dados.ate, fat: fatM, qtd: qtdM, nProd: (dados.rows || []).length });
  });
  const porProduto = Object.values(porCod).sort((a, b) => b.fat - a.fat);
  const fatTotal = porProduto.reduce((s, x) => s + x.fat, 0);
  const qtdTotal = porProduto.reduce((s, x) => s + x.qtd, 0);
  return { meses: porMes, porProduto, fatTotal, qtdTotal };
}

    if (ins.u === 'lata')    return `lata (${ins.f} ${ins.b})`;
    if (ins.u === 'unidade') return `unidade (1 ${ins.b})`;
    return `${ins.u} (${ins.f} ${ins.b})`;
  }

  function obsText(ins) {
    if (ins.b === 'g' && ins.u === 'kg') return 'Custo por grama = Preço/1000';
    if (ins.b === 'g')  return `Custo por grama = Preço/${ins.f}`;
    if (ins.b === 'ml') return `Custo por ml = Preço/${ins.f}`;
    if (ins.b === 'un' && ins.f === 1) return 'Custo por unidade';
    return `Custo por unidade = Preço/${ins.f}`;

    ['VILLAGE GOURMET — FICHAS TÉCNICAS DE CUSTO'],

    ['#', 'Produto / Ingrediente', 'Insumo Base', 'Peso/Qtd', 'Unidade', 'Custo Unit. Base', 'Custo Ingrediente', 'Preço Venda', 'Margem %'],

  let ficNum = 1, curCat2 = null;
  getFichaIds(state).forEach(fid => {
    const ficha = fichaDef(fid, state);
    if (!ficha) return;
    if (ficha.c !== curCat2) {
      curCat2 = ficha.c;
      aoa2.push([CAT_LABEL[ficha.c] || ficha.c]);
    }
    const calc = calcFicha(fid, state);
    // Linha cabeçalho do produto
    aoa2.push([String(ficNum++), '  ' + ficha.n, null, null, null, null, null, calc.p || '', `Meta: ${Math.round((calc.m || 0) * 100)}%`]);
    // Linhas de ingredientes
    ficha.i.forEach((ing, ii) => {
      const rIng = calcIng(fid, ii, state);
      let insumoNome = '— custo manual / sem rateio';
      let cu = null;
      if (ing.r && String(ing.r).slice(0, 2) === 'f:') {
        const sdef = fichaDef(String(ing.r).slice(2), state);
        insumoNome = sdef ? 'Sub-receita: ' + sdef.n : ing.r;
        cu = custoSubReceita(String(ing.r).slice(2), state) || null;
      } else if (ing.r) {
        const idef = getInsumoDef(ing.r, state);
        insumoNome = NOME_INS[ing.r] || (idef ? idef.n : ing.r);
        cu = custoBase(ing.r, state) || null;
      }
      aoa2.push([
        null,
        '    ↳ ' + ing.n,
        insumoNome,
        rIng.q || '',
        rIng.unid,
        cu || '',
        rIng.custo || '',
        null,
        null,
      ]);
    });
    // Linha custo total (inclui embalagem, se informada)
    aoa2.push([null, 'CUSTO TOTAL DO PRATO', null, null, null, null, calc.calculado ? calc.total : '', calc.p || '', calc.calculado && !ficha.sub ? calc.mb : '']);
  });
  const ws2 = XLSX.utils.aoa_to_sheet(aoa2);
  ws2['!cols'] = [{wch:4},{wch:42},{wch:40},{wch:10},{wch:8},{wch:16},{wch:18},{wch:12},{wch:10}];
  XLSX.utils.book_append_sheet(wb, ws2, '🧾 Fichas Técnicas');

  // ── ABA 3: Resumo Margens ────────────────────────────────────────────────────
  const aoa3 = [
    ['VILLAGE GOURMET — RESUMO DE MARGENS POR PRODUTO'],
    ['Calculado automaticamente com base nas Fichas Técnicas. Preencha os custos na aba Insumos Base e os pesos na aba Fichas Técnicas.'],
    ['#', 'Produto', 'Preço Venda', 'Custo Total', 'Margem R$', 'Margem %', 'Meta %', 'Ficha', 'Situação'],
  ];
  let resNum = 1, curCat3 = null;
  getFichaIds(state).forEach(fid => {
    const ficha = fichaDef(fid, state);
    if (!ficha || ficha.sub) return;
    if (ficha.c !== curCat3) {
      curCat3 = ficha.c;
      aoa3.push([CAT_LABEL[ficha.c] || ficha.c]);
    }
    const calc = calcFicha(fid, state);
    const { total, mb, calculado, p, m } = calc;
    const margRs = calculado ? p - total : '';
    const margPct = calculado ? mb : '';
    const fichaCol = calc.nIng ? `${calc.comCusto}/${calc.nIng}` : '';
    const sit = !calculado ? '⬛ Preencher'
      : calc.completo < 1 ? '🟡 Incompleta'
      : mb >= m ? '✅ OK'
      : mb >= m - 0.1 ? '⚠️ Atenção'
      : '🔴 Abaixo';
    aoa3.push([String(resNum++), ficha.n, p, calculado ? total : '', margRs, margPct, m, fichaCol, sit]);
  });
  const ws3 = XLSX.utils.aoa_to_sheet(aoa3);
  ws3['!cols'] = [{wch:4},{wch:42},{wch:12},{wch:12},{wch:12},{wch:10},{wch:8},{wch:8},{wch:14}];
  XLSX.utils.book_append_sheet(wb, ws3, '📊 Resumo Margens');

  // ── ABA 4: Vendas & CMV (se houver vendas lançadas) ─────────────────────────
  const vendas = (state.gestao || {}).vendas || {};
  const temVendas = Object.values(vendas).some(v => parsePreco(v) > 0);
  if (temVendas) {
    const aoa4 = [
      ['VILLAGE GOURMET — VENDAS DO PERÍODO E CMV TEÓRICO'],
      ['Período: ' + ((state.gestao || {}).periodo || '—')],
      ['#', 'Produto', 'Qtd Vendida', 'Preço Venda', 'Faturamento', 'Custo Unit.', 'CMV Teórico', 'Margem Contribuição'],
    ];
    let vNum = 1, fatT = 0, cmvT = 0;
    getFichaIds(state).forEach(fid => {
      const ficha = fichaDef(fid, state);
      if (!ficha || ficha.sub) return;
      const q = parsePreco(vendas[fid]);
      if (q <= 0) return;
      const calc = calcFicha(fid, state);
      const fat = q * calc.p;
      const cmv = calc.calculado ? q * calc.total : null;
      fatT += fat;
      if (cmv != null) cmvT += cmv;
      aoa4.push([String(vNum++), ficha.n, q, calc.p, fat, calc.calculado ? calc.total : '', cmv != null ? cmv : 'sem ficha', cmv != null ? fat - cmv : '']);
    });
    aoa4.push([]);
    aoa4.push([null, 'TOTAIS', null, null, fatT, null, cmvT, fatT - cmvT]);
    aoa4.push([null, 'CMV TEÓRICO %', null, null, fatT > 0 ? cmvT / fatT : '', null, null, null]);
    const ws4 = XLSX.utils.aoa_to_sheet(aoa4);
    ws4['!cols'] = [{wch:4},{wch:42},{wch:12},{wch:12},{wch:14},{wch:12},{wch:14},{wch:18}];
    XLSX.utils.book_append_sheet(wb, ws4, '📈 Vendas CMV');
  }

  XLSX.writeFile(wb, 'village-gourmet-custos.xlsx');
}

// ─── COMPONENTE: INSUMO ROW ───────────────────────────────────────────────────
function InsumoRow({ ins, sv, updateInsumo, onEdit, onDelete }) {
  const [det, setDet] = useState(false);
  const preco = parsePreco(sv.preco);
  const unid = sv.unid || ins.u;
  const cont = conteudoEfetivo(ins, sv);
  const rend = rendEfetivo(sv);
  const cu = preco > 0 && cont > 0 ? (preco / cont) / (rend / 100) : 0;
  const filled = preco > 0;
  const dias = filled ? diasDesde(sv.precoAt) : null;
  const stale = dias !== null && dias > STALE_DIAS;
  const hist = (sv.hist || []).slice(-5).reverse();

  const inpStyle = {
    border:'1px solid var(--inp-line)', borderRadius:6, padding:'7px 10px', fontSize:16,
    background:'var(--inp-bg)', width:'100%', color:'var(--tx)',
  };
  const selStyle = { ...inpStyle, appearance:'none', WebkitAppearance:'none', paddingRight:8 };
  const lbl = { fontSize:11, color:'var(--tx3)', marginBottom:3 };

  return (
    <div style={{
      padding:'12px 16px', borderBottom:'1px solid var(--soft)',
      background: filled ? 'var(--filled)' : 'var(--card)',
    }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
        <div style={{ fontWeight:600, fontSize:14, color:'var(--tx)' }}>
          {ins.n}
          {stale && <span title="Preço desatualizado" style={{ marginLeft:6, fontSize:11, color:'var(--red)', fontWeight:600 }}>⏰ {dias}d</span>}
        </div>
        {ins.custom && (
          <span style={{ display:'flex', gap:10, flexShrink:0 }}>
            <button onClick={onEdit} style={{ background:'transparent', fontSize:14 }} title="Editar insumo">✏️</button>
            <button onClick={onDelete} style={{ background:'transparent', fontSize:14 }} title="Excluir insumo">🗑️</button>
          </span>
        )}
      </div>
      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
        <div>
          <div style={lbl}>Preço de Compra (R$)</div>
          <input
            type="text" inputMode="decimal"
            placeholder="0,00"
            value={sv.preco || ''}
            onChange={e => {
              const v = e.target.value.replace('.', ',');
              if (v === '' || /^\d*,?\d{0,2}$/.test(v)) updateInsumo(ins.id, 'preco', v);
            }}
            style={inpStyle}
          />
        </div>
        <div>
          <div style={lbl}>Unidade de Compra</div>
          <select value={unid} onChange={e => updateInsumo(ins.id, 'unid', e.target.value)} style={selStyle}>
            {UNID_COMPRA.map(u => <option key={u} value={u}>{u}</option>)}
            {!UNID_COMPRA.includes(unid) && <option value={unid}>{unid}</option>}
          </select>
        </div>
      </div>
      <div style={{ fontSize:12, color:'var(--tx3)', marginTop:6, display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:4 }}>
        <span>
          1 {unid} = {cont} {ins.b}{rend < 100 ? ` · rend. ${rend}%` : ''}
          {cu > 0 && <span> · custo/{ins.b}: <strong style={{ color:'var(--tx)' }}>{ins.b === 'un' ? fmt2(cu) : fmt4(cu)}</strong></span>}
        </span>
        <button onClick={() => setDet(d => !d)} style={{ background:'transparent', fontSize:11, color:'var(--gold)', fontWeight:600 }}>
          ⚙️ ajustes {det ? '▾' : '▸'}
        </button>
      </div>
      {det && (
        <div style={{ marginTop:8, padding:'10px 12px', background:'var(--box)', borderRadius:8, border:'1px solid var(--soft)' }}>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8 }}>
            <div>
              <div style={lbl}>Conteúdo ({ins.b} por {unid})</div>
              <input
                type="text" inputMode="decimal"
                placeholder={String(conteudoPadrao(ins, unid))}
                value={sv.conteudo || ''}
                onChange={e => updateInsumo(ins.id, 'conteudo', e.target.value)}
                style={inpStyle}
              />
            </div>
            <div>
              <div style={lbl}>Rendimento % (aparas/perdas)</div>
              <input
                type="text" inputMode="decimal"
                placeholder="100"
                value={sv.rend || ''}
                onChange={e => updateInsumo(ins.id, 'rend', e.target.value)}
                style={inpStyle}
              />
            </div>
          </div>
          {rend < 100 && cu > 0 && (
            <div style={{ fontSize:11, color:'var(--amber)', marginTop:6 }}>
              Custo corrigido pela perda de {100 - rend}%: cada {ins.b} utilizável custa {ins.b === 'un' ? fmt2(cu) : fmt4(cu)}.
            </div>
          )}
          <div style={{ fontSize:11, color:'var(--tx3)', marginTop:8 }}>
            {sv.precoAt ? `Preço atualizado em ${fmtData(sv.precoAt)}` : 'Sem registro de data do preço'}
          </div>
          {hist.length > 0 && (
            <div style={{ fontSize:11, color:'var(--tx3)', marginTop:4 }}>
              Histórico: {hist.map(h => `${fmtData(h.d)} ${fmt2(h.p)}`).join(' · ')}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── COMPONENTE: INSUMOS GROUP ────────────────────────────────────────────────
function InsumosGroup({ grupo, insumos, stateInsumos, updateInsumo, onEditIns, onDeleteIns }) {
  const [open, setOpen] = useState(true);
  const filled = insumos.filter(ins => parsePreco((stateInsumos[ins.id] || {}).preco) > 0).length;

// ─── COMPONENTE: INSUMOS TAB ──────────────────────────────────────────────────
function InsumosTab({ state, updateInsumo, saveCustomInsumo, deleteCustomInsumo }) {
  const [search, setSearch] = useState('');
  const [modal, setModal] = useState(null);       // null | 'novo' | insumo em edição
  const [confirmDel, setConfirmDel] = useState(null);
  const grupos = {};
  getInsumos(state).forEach(ins => {
    if (!search || ins.n.toLowerCase().includes(search.toLowerCase())) {
      if (!grupos[ins.g]) grupos[ins.g] = [];
      grupos[ins.g].push(ins);
    }
  });
  return (
    <div>
      <div style={{ padding:'12px 16px', background:'var(--card)', borderBottom:'1px solid var(--soft)', display:'flex', gap:8 }}>
        <input
          type="search" placeholder="Buscar insumo..." value={search}
          onChange={e => setSearch(e.target.value)}
          style={{
            flex:1, padding:'9px 14px', border:'1px solid var(--inp-line)', borderRadius:8,
            fontSize:16, background:'var(--inp-bg)',
          }}
        />
        <button onClick={() => setModal('novo')} style={{
          padding:'9px 14px', borderRadius:8, fontSize:13, fontWeight:700,
          background:'var(--gold)', color:'var(--on-accent)', whiteSpace:'nowrap',
        }}>➕ Novo</button>
      </div>
      {Object.entries(grupos).map(([g, insumos]) => (
        <InsumosGroup
          key={g} grupo={g} insumos={insumos}
          stateInsumos={state.insumos || {}} updateInsumo={updateInsumo}
          onEditIns={ins => setModal(ins)} onDeleteIns={ins => setConfirmDel(ins)}
        />
      ))}
      {Object.keys(grupos).length === 0 && (
        <div style={{ textAlign:'center', padding:40, color:'var(--tx4)' }}>Nenhum insumo encontrado</div>
      )}
      <div style={{ height:16 }} />
      {modal && (
        <InsumoFormModal
          initial={modal === 'novo' ? null : modal} state={state}
          onSave={ins => { saveCustomInsumo(ins); setModal(null); }}
          onClose={() => setModal(null)}
        />
      )}
      {confirmDel && (
        <ConfirmModal
          message={`Excluir o insumo "${confirmDel.n}"? Fichas que o utilizam ficarão sem custo automático.`}
          okLabel="Excluir"
          onConfirm={() => { deleteCustomInsumo(confirmDel.id); setConfirmDel(null); }}
          onCancel={() => setConfirmDel(null)}
        />
      )}
    </div>
  );
}

// ─── COMPONENTE: INGREDIENTE ROW ──────────────────────────────────────────────
function IngRow({ ing, ii, fid, sf, stateGlobal, updateFicha }) {
  const si = sf['i' + ii] || {};
  const rawQ = si.qtd !== undefined ? si.qtd : (ing.q != null ? String(ing.q) : '');
  const r = calcIng(fid, ii, stateGlobal);
  const isSub = ing.r && String(ing.r).slice(0, 2) === 'f:';
  const insDef = ing.r && !isSub ? getInsumoDef(ing.r, stateGlobal) : null;
  const hasRef = !!ing.r;
  const cur = si.unid || ing.u;
  let unidOpts = UNID_ING;
  if (insDef) unidOpts = insDef.b === 'un' ? ['un'] : ['g', 'kg', 'ml', 'L'];
  const inpStyle = {
    border:'1px solid var(--inp-line)', borderRadius:6, padding:'6px 8px',
    fontSize:16, background:'var(--inp-bg)', width:'100%', color:'var(--tx)',
  };
  return (
    <div style={{ padding:'8px 12px', borderBottom:'1px solid var(--line-soft)', display:'grid', gridTemplateColumns:'1fr 60px 54px 68px', gap:5, alignItems:'start' }}>
      <div>
        <div style={{ display:'flex', alignItems:'center', gap:5, marginBottom:4 }}>
          <span style={{
            width:7, height:7, borderRadius:'50%', display:'inline-block', flexShrink:0,
            background: r.custo > 0 ? 'var(--green)' : hasRef ? 'var(--gold)' : 'var(--tx4)',
          }} />
          <span style={{ fontSize:13, color:'var(--tx1)', fontWeight:500 }}>{ing.n}</span>
        </div>
        {r.custo > 0 && (
          <div style={{ fontSize:11, color:'var(--tx3)', paddingLeft:12 }}>
            Custo: {fmt2(r.custo)}{r.manual ? ' (manual)' : ''}
          </div>
        )}
        {r.custo === 0 && !hasRef && (
          <div style={{ fontSize:10, color:'var(--gold)', paddingLeft:12 }}>sem insumo — informe R$ →</div>
        )}
      </div>
      <input
        type="text" inputMode="decimal"
        placeholder={ing.q != null ? String(ing.q) : 'qtd'}
        value={rawQ}
        onChange={e => {
          const v = e.target.value;
          if (v === '' || /^\d*[.,]?\d*$/.test(v)) updateFicha(fid, 'i' + ii, { ...si, qtd: v });
        }}
        style={inpStyle}
      />
      <select
        value={cur}
        onChange={e => updateFicha(fid, 'i' + ii, { ...si, unid: e.target.value })}
        style={{ ...inpStyle, appearance:'none', WebkitAppearance:'none', fontSize:13, padding:'6px 4px' }}
      >
        {unidOpts.map(u => <option key={u} value={u}>{u}</option>)}
        {!unidOpts.includes(cur) && <option value={cur}>{cur}</option>}
      </select>
      <input
        type="text" inputMode="decimal" title="Custo manual em R$ (substitui o cálculo automático)"
        placeholder="R$ man."
        value={si.custo || ''}
        onChange={e => {
          const v = e.target.value.replace('.', ',');
          if (v === '' || /^\d*,?\d{0,2}$/.test(v)) updateFicha(fid, 'i' + ii, { ...si, custo: v });
        }}
        style={{ ...inpStyle, fontSize:13, background: si.custo ? 'var(--warn-bg)' : 'var(--inp-bg)' }}
      />
    </div>
  );
}

// ─── COMPONENTE: FICHA CARD ───────────────────────────────────────────────────
function FichaCard({ fid, ficha, state, updateFicha, onEdit, onDelete, indiceRateio, somaPrecos }) {
  const [open, setOpen] = useState(false);
  const sf = (state.fichas || {})[fid] || {};
  const calc = calcFicha(fid, state);
  const { total, mb, ml, pmin, pdes, calculado, completo, comCusto, nIng, p, a } = calc;
  const incompleta = calculado && completo < 1;
  const impostoRS = calculado && !ficha.sub ? p * a : 0;
  const rateioRS = !ficha.sub && p > 0 ? p * (indiceRateio || 0) : 0;
  const participacao = !ficha.sub && p > 0 && somaPrecos > 0 ? p / somaPrecos : 0;
  const lucroRealRS = calculado && !ficha.sub ? p * ml - rateioRS : 0;

  const mbColor = calculado ? (mb >= calc.m ? 'var(--green)' : mb >= calc.m - 0.05 ? 'var(--gold)' : 'var(--red)') : 'var(--tx4)';

  const metricBox = (label, value, color) => (
    <div style={{ background:'var(--box)', borderRadius:6, padding:'8px 10px', textAlign:'center' }}>
      <div style={{ fontSize:10, color:'var(--tx3)', marginBottom:2 }}>{label}</div>
      <div style={{ fontSize:14, fontWeight:700, color: color || 'var(--tx)' }}>{value}</div>
    </div>
  );
  const inpStyle = { border:'1px solid var(--inp-line)', borderRadius:6, padding:'6px 8px', fontSize:15, background:'var(--card)', width:'100%', color:'var(--tx)' };
  const lbl = { fontSize:10, color:'var(--tx3)', marginBottom:2 };

  return (
    <div style={{ margin:'0 0 2px', background:'var(--card)', borderBottom:'1px solid var(--soft)' }}>
      <button onClick={() => setOpen(o => !o)} style={{
        width:'100%', display:'flex', alignItems:'center', justifyContent:'space-between',
        padding:'12px 16px', background:'transparent', border:'none', cursor:'pointer', textAlign:'left',
      }}>
        <div>
          <div style={{ fontWeight:600, fontSize:14, color:'var(--tx)' }}>
            {ficha.sub ? '🧪 ' : ''}{ficha.n}
          </div>
          <div style={{ fontSize:12, color:'var(--tx3)', marginTop:2 }}>
            {ficha.sub
              ? (calculado ? `Rende ${ficha.rendQ}${ficha.rendU} • custo/${ficha.rendU}: ${fmt4(total / (parsePreco(ficha.rendQ) || 1))}` : 'Sub-receita — preencha os custos')
              : <span>Venda: {fmt2(p)}
                  {calculado && <span style={{ color: mbColor, marginLeft:8, fontWeight:600 }}>• MgB {fmtPct(mb)}</span>}
                  {rateioRS > 0 && <span style={{ color:'var(--amber)', marginLeft:8, fontWeight:600 }}>• Fixo {fmt2(rateioRS)}</span>}
                  {incompleta && <span style={{ color:'var(--gold)', marginLeft:8, fontWeight:600 }}>⚠️ {comCusto}/{nIng}</span>}
                </span>}
          </div>
        </div>
        <span style={{ display:'flex', alignItems:'center', gap:10 }}>
          {ficha.custom && (
            <span style={{ display:'flex', gap:8 }}
              onClick={e => e.stopPropagation()}>
              <span onClick={onEdit} style={{ fontSize:14, cursor:'pointer' }} title="Editar ficha">✏️</span>
              <span onClick={onDelete} style={{ fontSize:14, cursor:'pointer' }} title="Excluir ficha">🗑️</span>
            </span>
          )}
          <span style={{ fontSize:16, color:'var(--tx4)', transition:'transform .2s', display:'inline-block', transform: open ? 'rotate(90deg)' : 'rotate(0)' }}>›</span>
        </span>
      </button>
      {open && (
        <div>
          {incompleta && (
            <div style={{ margin:'0 12px 10px', padding:'8px 12px', background:'var(--warn-bg)', border:'1px solid var(--warn-line)', borderRadius:8, fontSize:12, color:'var(--amber)' }}>
              ⚠️ Ficha incompleta: {comCusto} de {nIng} ingredientes com custo. A margem real é MENOR que a exibida.
            </div>
          )}
          {calculado && !ficha.sub && (
            <div style={{ padding:'0 12px 12px', display:'grid', gridTemplateColumns:'1fr 1fr', gap:6 }}>
              {metricBox('Custo Total', fmt2(total))}
              {metricBox('Margem Bruta', fmtPct(mb), mbColor)}
              {metricBox('Margem Líquida', fmtPct(ml), mb > 0 && ml > 0 ? 'var(--green)' : 'var(--red)')}
              {metricBox('Preço Mín. Viável', pmin > 0 ? fmt2(pmin) : '—', pmin > p ? 'var(--red)' : 'var(--green)')}
              {metricBox('Imposto (' + fmtPct(a) + ')', fmt2(impostoRS), 'var(--amber)')}
              {rateioRS > 0
                ? metricBox('Rateio Fixo/dia (' + fmtPct(participacao) + ' do cardápio)', fmt2(rateioRS), 'var(--amber)')
                : metricBox('Rateio Fixo/dia', '—')}
              {indiceRateio > 0 && (
                <div style={{ gridColumn:'1 / -1' }}>
                  {metricBox('Lucro Líquido Real', fmt2(lucroRealRS), lucroRealRS >= 0 ? 'var(--green)' : 'var(--red)')}
                </div>
              )}
            </div>
          )}
          {!ficha.sub && (
            <div style={{ padding:'0 12px 10px', display:'grid', gridTemplateColumns:'1fr 1fr 1fr 1fr', gap:6 }}>
              <div>
                <div style={lbl}>Preço Venda R$</div>
                <input type="text" inputMode="decimal" placeholder={String(ficha.p)} value={sf.p || ''}
                  onChange={e => { const v = e.target.value.replace('.', ','); if (v === '' || /^\d*,?\d{0,2}$/.test(v)) updateFicha(fid, 'p', v); }}
                  style={inpStyle} />
              </div>
              <div>
                <div style={lbl}>Meta Mg %</div>
                <input type="text" inputMode="decimal" placeholder={String(Math.round((ficha.m || 0) * 100))} value={sf.m || ''}
                  onChange={e => { const v = e.target.value; if (v === '' || /^\d{0,2}$/.test(v)) updateFicha(fid, 'm', v); }}
                  style={inpStyle} />
              </div>
              <div>
                <div style={lbl}>Imposto</div>
                <select value={sf.a !== undefined && sf.a !== '' ? String(sf.a) : String(ficha.a)}
                  onChange={e => updateFicha(fid, 'a', e.target.value)}
                  style={{ ...inpStyle, appearance:'none', WebkitAppearance:'none', fontSize:12, padding:'7px 4px' }}>
                  {ALIQUOTAS.map(al => <option key={al.v} value={String(al.v)}>{al.n}</option>)}
                </select>
              </div>
              <div>
                <div style={lbl}>Embalagem R$</div>
                <input type="text" inputMode="decimal" placeholder="0,00" value={sf.emb || ''}
                  onChange={e => { const v = e.target.value.replace('.', ','); if (v === '' || /^\d*,?\d{0,2}$/.test(v)) updateFicha(fid, 'emb', v); }}
                  style={inpStyle} />
              </div>
            </div>
          )}
          <div style={{ background:'var(--inp-bg)', borderTop:'1px solid var(--soft)', borderBottom:'1px solid var(--soft)' }}>
            <div style={{ padding:'8px 12px 4px', fontSize:11, color:'var(--tx4)', fontWeight:700, letterSpacing:.5 }}>
              INGREDIENTES — Nome | Qtd | Unid | R$ Manual
            </div>
            {ficha.i.map((ing, ii) => (
              <IngRow key={ii} ing={ing} ii={ii} fid={fid} sf={sf} stateGlobal={state} updateFicha={updateFicha} />
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

              <select style={inpStyle} value={f.rendU} onChange={e => set('rendU', e.target.value)}>
                <option value="g">g</option><option value="ml">ml</option><option value="un">un</option>
              </select>
            </div>
          </div>
        )}
        <div style={{ ...lbl, marginTop:14, fontWeight:700 }}>INGREDIENTES</div>
        {f.i.map((r, ix) => (
          <div key={ix} style={{ border:'1px solid var(--soft)', borderRadius:8, padding:8, marginBottom:8 }}>
            <div style={{ display:'flex', gap:6 }}>
              <input style={{ ...inpStyle, flex:1 }} value={r.n} onChange={e => setIng(ix, 'n', e.target.value)} placeholder="Nome do ingrediente" />
              <button onClick={() => delIng(ix)} style={{ background:'transparent', fontSize:15 }} title="Remover">🗑️</button>
            </div>
            <div style={{ display:'grid', gridTemplateColumns:'2fr 1fr 1fr', gap:6, marginTop:6 }}>
              <select style={{ ...inpStyle, fontSize:12 }} value={r.r} onChange={e => setIng(ix, 'r', e.target.value)}>
                <option value="">— custo manual —</option>
                {subReceitas.length > 0 && (
                  <optgroup label="SUB-RECEITAS">
                    {subReceitas.map(s => <option key={s.id} value={'f:' + s.id}>🧪 {s.n}</option>)}
                  </optgroup>
                )}
                {Object.entries(insumosPorGrupo).map(([g, list]) => (
                  <optgroup key={g} label={g}>
                    {list.map(ins => <option key={ins.id} value={ins.id}>{ins.n}</option>)}
                  </optgroup>
                ))}
              </select>
              <input style={inpStyle} inputMode="decimal" value={r.q} onChange={e => setIng(ix, 'q', e.target.value)} placeholder="qtd" />
              <select style={inpStyle} value={r.u} onChange={e => setIng(ix, 'u', e.target.value)}>
                {UNID_ING.map(u => <option key={u} value={u}>{u}</option>)}
              </select>
            </div>
          </div>
        ))}
        <button onClick={addIng} style={{ width:'100%', padding:'9px 0', borderRadius:8, fontSize:13, fontWeight:600, background:'var(--soft)', color:'var(--tx1)' }}>➕ Adicionar ingrediente</button>
        <div style={{ display:'flex', gap:10, marginTop:16 }}>
          <button onClick={onClose} style={{ flex:1, padding:'11px 0', borderRadius:8, fontSize:14, fontWeight:600, background:'var(--soft)', color:'var(--tx1)' }}>Cancelar</button>
          <button
            disabled={!valido}
            onClick={() => onSave({
              id: initial ? initial.id : genId('cf'),
              c: f.sub ? 'SUB_RECEITAS' : f.c, n: f.n.trim(),
              p: f.sub ? 0 : parsePreco(f.p),
              m: (parsePreco(f.m) || 65) / 100,
              a: parseFloat(f.a) || 0.0809,
              sub: f.sub, rendQ: f.sub ? parsePreco(f.rendQ) : undefined, rendU: f.sub ? f.rendU : undefined,
              custom: true,
              i: ingsValidos.map(r => ({ n: r.n.trim(), r: r.r || null, q: parsePreco(r.q) || null, u: r.u })),
            })}
            style={{ flex:1, padding:'11px 0', borderRadius:8, fontSize:14, fontWeight:700, background: valido ? 'var(--green)' : 'var(--tx4)', color:'var(--on-accent)' }}
          >{initial ? 'Salvar' : 'Criar Ficha'}</button>
        </div>
      </div>
    </div>
  );
}

// ─── COMPONENTE: FICHAS TAB ───────────────────────────────────────────────────
function FichasTab({ state, updateFicha, saveCustomFicha, deleteCustomFicha }) {
  const [search, setSearch] = useState('');
  const [openGroups, setOpenGroups] = useState({});
  const [modal, setModal] = useState(null);       // null | 'novo' | ficha custom em edição
  const [confirmDel, setConfirmDel] = useState(null);

  const isOpen = g => openGroups[g] !== false;
  const toggleGroup = g => setOpenGroups(prev => ({ ...prev, [g]: !isOpen(g) }));

  const updateFichaIng = useCallback((fid, key, val) => {
    updateFicha(fid, key, val);
  }, [updateFicha]);

  const { indiceRateio, somaPrecos } = calcRateioFixo(state);

  const grupos = {};
  getFichaIds(state).forEach(fid => {
    const f = fichaDef(fid, state);
    if (!f) return;
    if (!search || f.n.toLowerCase().includes(search.toLowerCase())) {
      if (!grupos[f.c]) grupos[f.c] = [];
      grupos[f.c].push({ f, fid });
    }
  });

  const catIcons = {
    CHOPP:'🍺', HAMBURGUERES:'🍔', COMBOS:'🍔', BATATAS:'🍟', PANQUECAS:'🥞',
    CARNES:'🥩', SOBREMESAS:'🍮', PETISCOS:'🍗', EXECUTIVOS:'🍽️',
    DRINKS:'🍹', CERVEJAS_600:'🍺', LONG_NECKS:'🍻',
    SUCOS_AGUAS:'💧', REFRIGERANTES:'🥤', ENERGETICOS:'⚡',
    DESTILADOS:'🥃', GUARNICOES:'🌿', ADICIONAIS:'➕', SORTIDOS:'🍬', SUB_RECEITAS:'🧪',
  };

  return (
    <div>
      <div style={{ padding:'12px 16px', background:'var(--card)', borderBottom:'1px solid var(--soft)', display:'flex', gap:8 }}>
        <input
          type="search" placeholder="Buscar ficha ou produto..." value={search}
          onChange={e => setSearch(e.target.value)}
          style={{ flex:1, padding:'9px 14px', border:'1px solid var(--inp-line)', borderRadius:8, fontSize:16, background:'var(--inp-bg)' }}
        />
        <button onClick={() => setModal('novo')} style={{
          padding:'9px 14px', borderRadius:8, fontSize:13, fontWeight:700,
          background:'var(--gold)', color:'var(--on-accent)', whiteSpace:'nowrap',
        }}>➕ Nova</button>
      </div>
      {Object.entries(grupos).map(([g, items]) => {
        const calcCount = items.filter(({ fid }) => calcFicha(fid, state).calculado).length;
        return (
          <div key={g}>
            <button onClick={() => toggleGroup(g)} style={{
              width:'100%', display:'flex', alignItems:'center', justifyContent:'space-between',
              padding:'12px 16px', background:'var(--soft)', border:'none', cursor:'pointer', textAlign:'left',
            }}>
              <span style={{ fontWeight:700, fontSize:13, letterSpacing:.5 }}>
                {catIcons[g] || '📋'} {g}
              </span>
              <span style={{ fontSize:12, color:'var(--tx3)', display:'flex', alignItems:'center', gap:8 }}>
                <span style={{
                  padding:'2px 8px', borderRadius:10,
                  background: calcCount === items.length ? 'var(--ok-bg)' : 'var(--card)',
                  color: calcCount === items.length ? 'var(--ok-tx)' : 'var(--tx2)', fontWeight:600,
                }}>{calcCount}/{items.length}</span>
                <span style={{ fontSize:14, transition:'transform .2s', display:'inline-block', transform: isOpen(g) ? 'rotate(90deg)' : 'rotate(0)' }}>›</span>
              </span>
            </button>
            {isOpen(g) && (
              <div className="cards-grid">
                {items.map(({ f, fid }) => (
                  <FichaCard
                    key={fid} fid={fid} ficha={f} state={state} updateFicha={updateFichaIng}
                    onEdit={() => setModal(f)} onDelete={() => setConfirmDel({ f, fid })}
                    indiceRateio={indiceRateio} somaPrecos={somaPrecos}
                  />
                ))}
              </div>
            )}
          </div>
        );
      })}
      {Object.keys(grupos).length === 0 && (
        <div style={{ textAlign:'center', padding:40, color:'var(--tx4)' }}>Nenhuma ficha encontrada</div>
      )}
      <div style={{ height:16 }} />
      {modal && (
        <FichaFormModal
          initial={modal === 'novo' ? null : modal} state={state}
          onSave={fic => { saveCustomFicha(fic); setModal(null); }}
          onClose={() => setModal(null)}
        />
      )}
      {confirmDel && (
        <ConfirmModal
          message={`Excluir a ficha "${confirmDel.f.n}"? As quantidades e vendas lançadas dela serão removidas.`}
          okLabel="Excluir"
          onConfirm={() => { deleteCustomFicha(confirmDel.fid); setConfirmDel(null); }}
          onCancel={() => setConfirmDel(null)}
        />
      )}
    </div>
  );
}

// ─── COMPONENTE: RESUMO TAB ───────────────────────────────────────────────────

  const desatualizados = todosInsumos.filter(ins => {
    const sv = (state.insumos || {})[ins.id] || {};

    return d !== null && d > STALE_DIAS;

  // Cor-base de cada categoria; fundo e texto do badge derivam dela via
  // color-mix, então se adaptam automaticamente ao tema claro/escuro

    CHOPP:'#1565c0', HAMBURGUERES:'#1565c0', COMBOS:'#1565c0', BATATAS:'#f57f17',

          <div style={{ marginTop:6, height:4, background:'var(--soft)', borderRadius:2 }}>
            <div style={{ height:'100%', background:'var(--green)', width: (todasFichas.length ? calcFichas.length/todasFichas.length*100 : 0) + '%', borderRadius:2 }} />

        </div>
      </div>

      {incompletas.length > 0 && (

                    <div style={{ fontSize:10, color:'var(--tx4)' }}>Mg. Bruta</div>

          <div>Preencha os insumos e as quantidades das fichas para ver o resumo aqui.</div>
        </div>
      )}
      <div style={{ height:16 }} />
    </div>
  );
}

// ─── COMPONENTE: GESTÃO TAB ───────────────────────────────────────────────────
function GestaoTab({ state, updateGestao, onImport }) {
  const [searchV, setSearchV] = useState('');
  const [confirmImport, setConfirmImport] = useState(null);
  const g = state.gestao || {};
  const vendas = g.vendas || {};
  const fileRef = useRef(null);

  const { rows, vend, fat, vendComFicha, cmvT, fatComFicha, cmvPct, semFicha } = calcVendasResumo(state);

  // Engenharia de cardápio (popularidade × margem)
  const totalQ = vendComFicha.reduce((s, x) => s + x.q, 0);
  const engenharia = vendComFicha.length >= 2 ? vendComFicha.map(x => {
    const popular = x.q / totalQ >= 0.7 * (1 / vendComFicha.length);
    const lucrativo = x.calc.mb >= x.calc.m;
    const cls = popular && lucrativo ? '⭐ Estrela'
      : popular ? '🐴 Burro de Carga'
      : lucrativo ? '💎 Quebra-Cabeça'
      : '🍍 Abacaxi';
    return { ...x, cls, popular, lucrativo };
  }) : [];
  const ORDEM_CLS = ['⭐ Estrela', '🐴 Burro de Carga', '💎 Quebra-Cabeça', '🍍 Abacaxi'];
  const DICA_CLS = {
    '⭐ Estrela': 'Vende muito com boa margem — destaque no cardápio e proteja o padrão.',
    '🐴 Burro de Carga': 'Vende muito com margem fraca — reduza custo ou reajuste o preço.',
    '💎 Quebra-Cabeça': 'Margem boa mas vende pouco — promova, reposicione ou treine a equipe para sugerir.',
    '🍍 Abacaxi': 'Nem vende nem dá margem — reformule ou tire do cardápio.',
  };

  // CMV real
  const compras = parsePreco(g.compras);
  const fatReal = parsePreco(g.fatReal);
  const cmvRealPct = fatReal > 0 ? compras / fatReal : 0;

  // Rateio de custos indiretos (fixos), proporcional ao cardápio (fixo diário)
  const { custosFixos, custosFixosDia, somaPrecos, indiceRateio } = calcRateioFixo(state);
  const faturamentoPeriodo = fatReal > 0 ? fatReal : fat;
  // Redistribui a TODOS os produtos com ficha calculada, com ou sem venda lançada no período
  const calcRows = rows.filter(x => x.calc.calculado);
  const comRateio = calcRows.map(x => {
    const rateioUn = x.calc.p * indiceRateio;
    const lucroUn = x.calc.p * x.calc.ml - rateioUn;
    return { ...x, rateioUn, lucroUn, lucroTotal: lucroUn * x.q };
  });
  const margemContribTotal = vendComFicha.reduce((s, x) => s + x.q * x.calc.p * x.calc.ml, 0);
  const mcPct = fatComFicha > 0 ? margemContribTotal / fatComFicha : 0;
  const pontoEquilibrio = mcPct > 0 ? custosFixos / mcPct : 0;
  const lucroLiquidoPeriodo = comRateio.reduce((s, x) => s + x.lucroTotal, 0);

  const card = { background:'var(--card)', borderRadius:10, padding:'14px 16px', boxShadow:'0 1px 4px var(--shadow)', marginBottom:14 };
  const h = { fontWeight:700, fontSize:13, letterSpacing:.5, marginBottom:10, color:'var(--tx)' };
  const inpStyle = { border:'1px solid var(--inp-line)', borderRadius:6, padding:'7px 10px', fontSize:16, background:'var(--inp-bg)', width:'100%', color:'var(--tx)' };
  const lbl = { fontSize:11, color:'var(--tx3)', marginBottom:3 };
  const numInput = (field, placeholder) => (
    <input type="text" inputMode="decimal" placeholder={placeholder} value={g[field] || ''}
      onChange={e => { const v = e.target.value.replace('.', ','); if (v === '' || /^\d*,?\d{0,2}$/.test(v)) updateGestao(field, v); }}
      style={inpStyle} />
  );

  const exportBackup = () => {
    const blob = new Blob([JSON.stringify({ vg: state }, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'village-gourmet-backup-' + hoje() + '.json';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  const handleFile = e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const obj = JSON.parse(reader.result);
        const dados = obj && obj.vg ? obj.vg : obj;
        if (!dados || (typeof dados !== 'object')) throw new Error();
        setConfirmImport(dados);
      } catch { alert('Arquivo inválido — selecione um backup JSON gerado por este app.'); }
    };
    reader.readAsText(file);
  };

  const rowsFiltradas = rows.filter(x => !searchV || x.d.n.toLowerCase().includes(searchV.toLowerCase()));

  return (
    <div className="tab-content" style={{ padding:'12px 16px' }}>
      <div className="gestao-grid">
      {/* Custos variáveis */}
      <div style={card}>
        <div style={h}>⚙️ CUSTOS VARIÁVEIS SOBRE A VENDA</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          <div>
            <div style={lbl}>Taxa de cartão média (%)</div>
            {numInput('cartao', 'Ex: 3,5')}
          </div>
          <div>
            <div style={lbl}>Outros custos variáveis (%)</div>
            {numInput('outros', 'Ex: 2')}
          </div>
        </div>
        <div style={{ fontSize:11, color:'var(--tx3)', marginTop:8 }}>
          Entram na Margem Líquida de todas as fichas, somados ao imposto de cada produto.
        </div>
      </div>

      {/* Custos indiretos (fixos) */}
      <div style={card}>
        <div style={h}>🏢 CUSTOS INDIRETOS (FIXOS) DO PERÍODO</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          <div>
            <div style={lbl}>Aluguel (R$)</div>
            {numInput('aluguel', '0,00')}
          </div>
          <div>
            <div style={lbl}>Energia / Água (R$)</div>
            {numInput('energia', '0,00')}
          </div>
          <div>
            <div style={lbl}>Depreciação de equipamentos (R$)</div>
            {numInput('deprec', '0,00')}
          </div>
          <div>
            <div style={lbl}>Folha de funcionários (R$)</div>
            {numInput('folha', '0,00')}
          </div>
          <div style={{ gridColumn:'1 / -1' }}>
            <div style={lbl}>Outros fixos — internet, contador, seguro etc. (R$)</div>
            {numInput('outrosFixos', '0,00')}
          </div>
        </div>
        {custosFixos > 0 && (
          <div style={{ marginTop:10, display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:6 }}>
            <div style={{ background:'var(--box)', borderRadius:6, padding:'8px 10px', textAlign:'center' }}>
              <div style={{ fontSize:10, color:'var(--tx3)' }}>Fixos do mês</div>
              <div style={{ fontSize:15, fontWeight:700 }}>{fmt2(custosFixos)}</div>
            </div>
            <div style={{ background:'var(--box)', borderRadius:6, padding:'8px 10px', textAlign:'center' }}>
              <div style={{ fontSize:10, color:'var(--tx3)' }}>Fixos por dia (÷30)</div>
              <div style={{ fontSize:15, fontWeight:700 }}>{fmt2(custosFixosDia)}</div>
            </div>
            <div style={{ background:'var(--box)', borderRadius:6, padding:'8px 10px', textAlign:'center' }}>
              <div style={{ fontSize:10, color:'var(--tx3)' }}>Soma dos preços do cardápio</div>
              <div style={{ fontSize:15, fontWeight:700 }}>{somaPrecos > 0 ? fmt2(somaPrecos) : '—'}</div>
            </div>
          </div>
        )}
        {custosFixos > 0 && indiceRateio === 0 && (
          <div style={{ fontSize:12, color:'var(--red)', marginTop:8, padding:'8px 10px', background:'var(--err-bg)', borderRadius:6 }}>
            ⚠️ Nenhum produto com preço de venda cadastrado — revise os preços na aba Fichas para o rateio ser calculado.
          </div>
        )}
        <div style={{ fontSize:11, color:'var(--tx3)', marginTop:8 }}>
          Método: rateio <strong>proporcional ao cardápio</strong>, com custo fixo diário — participação = preço do produto ÷ soma dos preços de todos os produtos;
          rateio do produto = (custos fixos ÷ 30 dias) × participação. As fatias de todos os produtos somam 100% do fixo diário.
          Não depende de faturamento nem de vendas; recalculado automaticamente a cada alteração.
        </div>
      </div>

      {/* Lucro líquido real (após rateio) */}
      {custosFixos > 0 && comRateio.length > 0 && (
        <div style={card}>
          <div style={h}>💵 LUCRO LÍQUIDO REAL POR PRODUTO (após rateio de fixos)</div>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:6, marginBottom:10 }}>
            <div style={{ background:'var(--box)', borderRadius:6, padding:'8px 10px', textAlign:'center' }}>
              <div style={{ fontSize:10, color:'var(--tx3)' }}>Ponto de equilíbrio (faturamento)</div>
              <div style={{ fontSize:15, fontWeight:700 }}>{pontoEquilibrio > 0 ? fmt2(pontoEquilibrio) : '—'}</div>
            </div>
            <div style={{ background:'var(--box)', borderRadius:6, padding:'8px 10px', textAlign:'center' }}>
              <div style={{ fontSize:10, color:'var(--tx3)' }}>Lucro líquido do período</div>
              <div style={{ fontSize:15, fontWeight:700, color: lucroLiquidoPeriodo >= 0 ? 'var(--green)' : 'var(--red)' }}>{fmt2(lucroLiquidoPeriodo)}</div>
            </div>
          </div>
          {faturamentoPeriodo > 0 && pontoEquilibrio > 0 && faturamentoPeriodo < pontoEquilibrio && (
            <div style={{ fontSize:12, color:'var(--red)', marginBottom:10 }}>
              🔴 Faturamento do período ({fmt2(faturamentoPeriodo)}) está abaixo do ponto de equilíbrio — operação com prejuízo real mesmo com margem bruta positiva.
            </div>
          )}
          {vendComFicha.length === 0 && (
            <div style={{ fontSize:11, color:'var(--gold)', marginBottom:10 }}>
              Nenhuma venda lançada ainda — o rateio por unidade já está calculado, mas o total do período e o ponto de equilíbrio ficam mais precisos lançando as vendas abaixo.
            </div>
          )}
          <div style={{ maxHeight:280, overflowY:'auto', border:'1px solid var(--soft)', borderRadius:8 }}>
            {comRateio.sort((a, b) => a.lucroUn - b.lucroUn).map(x => (
              <div key={x.fid} style={{ display:'flex', alignItems:'center', gap:8, padding:'7px 10px', borderBottom:'1px solid var(--line-soft)' }}>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontSize:12, fontWeight:500, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{x.d.n}</div>
                  <div style={{ fontSize:10, color:'var(--tx4)' }}>rateio: {fmt2(x.rateioUn)} · {x.q > 0 ? x.q + '× vendido' : 'sem venda lançada'}</div>
                </div>
                <div style={{ textAlign:'right', flexShrink:0 }}>
                  <div style={{ fontSize:13, fontWeight:700, color: x.lucroUn >= 0 ? 'var(--green)' : 'var(--red)' }}>{fmt2(x.lucroUn)}/un</div>
                  {x.q > 0 && <div style={{ fontSize:10, color:'var(--tx3)' }}>{fmt2(x.lucroTotal)} total</div>}
                </div>
              </div>
            ))}
          </div>
          <div style={{ fontSize:11, color:'var(--tx3)', marginTop:8 }}>
            Lucro líquido real = Margem Líquida (já descontando ingredientes, embalagem, impostos e cartão) − Rateio de custos fixos. Produtos no vermelho vendem, mas não sustentam a estrutura do bar sozinhos.
          </div>
        </div>
      )}

      {/* Vendas do período */}
      <div style={card}>
        <div style={h}>📈 VENDAS DO PERÍODO</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr', gap:8, marginBottom:10 }}>
          <input type="text" placeholder="Período (ex: 07/2026)" value={g.periodo || ''}
            onChange={e => updateGestao('periodo', e.target.value)} style={inpStyle} />
          <input type="search" placeholder="Buscar produto para lançar venda..." value={searchV}
            onChange={e => setSearchV(e.target.value)} style={inpStyle} />
        </div>
        <div style={{ maxHeight:300, overflowY:'auto', border:'1px solid var(--soft)', borderRadius:8 }}>
          {rowsFiltradas.map(x => (
            <div key={x.fid} style={{ display:'flex', alignItems:'center', gap:8, padding:'6px 10px', borderBottom:'1px solid var(--line-soft)' }}>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:12, fontWeight:500, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{x.d.n}</div>
                <div style={{ fontSize:10, color:'var(--tx4)' }}>{fmt2(x.calc.p)}{x.calc.calculado ? ' · custo ' + fmt2(x.calc.total) : ' · sem ficha'}</div>
              </div>
              <input type="text" inputMode="numeric" placeholder="qtd" value={vendas[x.fid] || ''}
                onChange={e => { const v = e.target.value; if (v === '' || /^\d{0,5}$/.test(v)) updateGestao('vendas', { ...vendas, [x.fid]: v }); }}
                style={{ ...inpStyle, width:64, textAlign:'center', padding:'6px 4px' }} />
            </div>
          ))}
        </div>
        {vend.length > 0 && (
          <div style={{ marginTop:10, display:'grid', gridTemplateColumns:'1fr 1fr', gap:6 }}>
            <div style={{ background:'var(--box)', borderRadius:6, padding:'8px 10px', textAlign:'center' }}>
              <div style={{ fontSize:10, color:'var(--tx3)' }}>Faturamento teórico</div>
              <div style={{ fontSize:15, fontWeight:700 }}>{fmt2(fat)}</div>
            </div>
            <div style={{ background:'var(--box)', borderRadius:6, padding:'8px 10px', textAlign:'center' }}>
              <div style={{ fontSize:10, color:'var(--tx3)' }}>CMV teórico</div>
              <div style={{ fontSize:15, fontWeight:700, color: cmvPct > 0.38 ? 'var(--red)' : 'var(--green)' }}>{fmt2(cmvT)} ({fmtPct(cmvPct)})</div>
            </div>
            <div style={{ background:'var(--box)', borderRadius:6, padding:'8px 10px', textAlign:'center', gridColumn:'1 / -1' }}>
              <div style={{ fontSize:10, color:'var(--tx3)' }}>Margem de contribuição (fichas calculadas)</div>
              <div style={{ fontSize:15, fontWeight:700, color:'var(--green)' }}>{fmt2(fatComFicha - cmvT)}</div>
            </div>
            {semFicha > 0 && (
              <div style={{ gridColumn:'1 / -1', fontSize:11, color:'var(--gold)' }}>
                ⚠️ {semFicha} produto(s) vendido(s) sem ficha calculada — fora do CMV teórico.
              </div>
            )}
          </div>
        )}
      </div>

      {/* Engenharia de cardápio */}
      {engenharia.length > 0 && (
        <div style={card}>
          <div style={h}>🏆 ENGENHARIA DE CARDÁPIO</div>
          {ORDEM_CLS.map(cls => {
            const items = engenharia.filter(x => x.cls === cls);
            if (!items.length) return null;
            return (
              <div key={cls} style={{ marginBottom:10 }}>
                <div style={{ fontSize:12, fontWeight:700, marginBottom:2 }}>{cls} ({items.length})</div>
                <div style={{ fontSize:11, color:'var(--tx3)', marginBottom:4 }}>{DICA_CLS[cls]}</div>
                <div style={{ fontSize:12, color:'var(--tx1)', lineHeight:1.6 }}>
                  {items.sort((a, b) => b.q - a.q).map(x => `${x.d.n} (${x.q}× · MgB ${fmtPct(x.calc.mb)})`).join(' · ')}
                </div>
              </div>
            );
          })}
        </div>
      )}

      {/* CMV real */}
      <div style={card}>
        <div style={h}>💰 CMV REAL × TEÓRICO</div>
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          <div>
            <div style={lbl}>Compras de insumos no período (R$)</div>
            {numInput('compras', '0,00')}
          </div>
          <div>
            <div style={lbl}>Faturamento real do período (R$)</div>
            {numInput('fatReal', '0,00')}
          </div>
        </div>
        {fatReal > 0 && compras > 0 && (
          <div style={{ marginTop:10, fontSize:13, lineHeight:1.7 }}>
            <div>CMV real: <strong style={{ color: cmvRealPct > 0.38 ? 'var(--red)' : 'var(--green)' }}>{fmtPct(cmvRealPct)}</strong>
              {cmvPct > 0 && <span> · CMV teórico: <strong>{fmtPct(cmvPct)}</strong></span>}
            </div>
            {cmvPct > 0 && cmvRealPct - cmvPct > 0.03 && (
              <div style={{ fontSize:12, color:'var(--red)', marginTop:4 }}>
                🔴 CMV real {fmtPct(cmvRealPct - cmvPct)} acima do teórico — investigue perdas, porções fora do padrão, desvios ou compras em excesso (estoque parado).
              </div>
            )}
            {cmvPct > 0 && cmvRealPct - cmvPct <= 0.03 && cmvRealPct - cmvPct >= -0.03 && (
              <div style={{ fontSize:12, color:'var(--green)', marginTop:4 }}>✅ CMV real alinhado ao teórico — operação sob controle.</div>
            )}
          </div>
        )}
        <div style={{ fontSize:11, color:'var(--tx3)', marginTop:8 }}>
          Referência para bares: CMV saudável entre 28% e 38%. A diferença entre real e teórico revela perdas invisíveis.
        </div>
      </div>

      {/* Backup */}
      <div style={card}>
        <div style={h}>💾 BACKUP DOS DADOS</div>
        <div style={{ display:'flex', gap:8 }}>
          <button onClick={exportBackup} style={{ flex:1, padding:'10px 0', borderRadius:8, fontSize:13, fontWeight:700, background:'var(--green)', color:'var(--on-accent)' }}>⬇️ Exportar JSON</button>
          <button onClick={() => fileRef.current && fileRef.current.click()} style={{ flex:1, padding:'10px 0', borderRadius:8, fontSize:13, fontWeight:700, background:'var(--gold)', color:'var(--on-accent)' }}>⬆️ Importar JSON</button>
          <input ref={fileRef} type="file" accept=".json,application/json" style={{ display:'none' }} onChange={handleFile} />
        </div>
        <div style={{ fontSize:11, color:'var(--tx3)', marginTop:8 }}>
          Exporte um backup antes de mudanças grandes. A importação substitui TODOS os dados atuais (exige ☁️ Salvar depois).
        </div>
      </div>
      </div>
      <div style={{ height:16 }} />
      {confirmImport && (
        <ConfirmModal
          message="Importar este backup? Todos os dados atuais serão substituídos pelos do arquivo (será preciso clicar em ☁️ Salvar para enviar ao servidor)."
          okLabel="Importar"
          onConfirm={() => { onImport(confirmImport); setConfirmImport(null); }}
          onCancel={() => setConfirmImport(null)}
        />
      )}
    </div>
  );
}

// ─── COMPONENTE: FILTRO DE MESES (compartilhado entre Vendas e Gráficos) ──────
function FiltroMeses({ vendas, filtro, setFiltro }) {
  const meses = mesesOrdenados(vendas);
  if (!meses.length) return null;
  const selStyle = {
    border:'1px solid var(--inp-line)', borderRadius:6, padding:'7px 10px', fontSize:14,
    background:'var(--inp-bg)', color:'var(--tx)', appearance:'none', WebkitAppearance:'none',
  };
  return (
    <div style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
      <span style={{ fontSize:12, color:'var(--tx3)', fontWeight:600 }}>Período:</span>
      <select style={selStyle} value={filtro.de || ''} onChange={e => setFiltro({ ...filtro, de: e.target.value })}>
        <option value="">Desde o início</option>
        {meses.map(m => <option key={m} value={m}>{fmtMes(m)}</option>)}
      </select>
      <span style={{ fontSize:12, color:'var(--tx3)' }}>até</span>
      <select style={selStyle} value={filtro.ate || ''} onChange={e => setFiltro({ ...filtro, ate: e.target.value })}>
        <option value="">Mais recente</option>
        {meses.map(m => <option key={m} value={m}>{fmtMes(m)}</option>)}
      </select>
      {(filtro.de || filtro.ate) && (
        <button onClick={() => setFiltro({ de:'', ate:'' })} style={{
          background:'var(--soft)', color:'var(--tx1)', borderRadius:6, padding:'7px 12px', fontSize:12, fontWeight:600,
        }}>✕ Limpar</button>
      )}
    </div>
  );
}

// ─── COMPONENTE: VENDAS TAB ───────────────────────────────────────────────────
function VendasTab({ vendas, vendasStatus, state, filtro, setFiltro, onImportMes, onDeleteMes, onSetVinculo }) {
  const fileRef = useRef(null);
  const [erro, setErro] = useState('');
  const [confirmSubst, setConfirmSubst] = useState(null);  // parsed aguardando confirmação
  const [confirmDel, setConfirmDel] = useState(null);      // mes aguardando exclusão
  const [search, setSearch] = useState('');
  const [sort, setSort] = useState({ k:'fat', asc:false });
  const [editCod, setEditCod] = useState(null);            // linha com select de vínculo aberto

  const agg = agregarVendas(vendas, filtro.de, filtro.ate);
  const map = vendas.map || {};
  const temMeses = mesesOrdenados(vendas).length > 0;

  // Opções de ficha para o vínculo manual (só produtos finais, não sub-receitas)
  const fichasOpcoes = getFichaIds(state)
    .map(fid => ({ fid, d: fichaDef(fid, state) }))
    .filter(x => x.d && !x.d.sub)
    .map(x => ({ fid: x.fid, n: x.d.n }))
    .sort((a, b) => a.n.localeCompare(b.n, 'pt-BR'));

  // Linhas da tabela com vínculo e CMV real
  const linhas = agg.porProduto.map(pr => {
    const fid = resolverVinculo(pr.cod, pr.nome, map, state);
    const calc = fid ? calcFicha(fid, state) : null;
    const temCusto = calc && calc.calculado;
    const cmv = temCusto ? pr.qtd * calc.total : null;
    return {
      ...pr, fid,
      fichaNome: fid ? (fichaDef(fid, state) || {}).n : null,
      manual: map[pr.cod] !== undefined,
      cmv, margem: cmv != null ? pr.fat - cmv : null,
      part: agg.fatTotal > 0 ? pr.fat / agg.fatTotal : 0,
    };
  }).filter(l => !search || l.nome.toLowerCase().includes(search.toLowerCase()));

  const dir = sort.asc ? 1 : -1;
  linhas.sort((a, b) => {
    if (sort.k === 'nome') return a.nome.localeCompare(b.nome, 'pt-BR') * dir;
    return ((a[sort.k] || 0) - (b[sort.k] || 0)) * dir;
  });
  const setSortK = k => setSort(s => s.k === k ? { k, asc: !s.asc } : { k, asc: k === 'nome' });

  const comCmv = linhas.filter(l => l.cmv != null);
  const cmvTotal = comCmv.reduce((s, l) => s + l.cmv, 0);
  const fatComCmv = comCmv.reduce((s, l) => s + l.fat, 0);
  const semVinculo = linhas.filter(l => !l.fid).length;

  const handleFile = e => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    setErro('');
    const reader = new FileReader();
    reader.onload = () => {
      const parsed = parseRelatorioVendas(reader.result);
      if (!parsed.ok) { setErro(parsed.erro); return; }
      if ((vendas.meses || {})[parsed.mes]) setConfirmSubst(parsed);
      else onImportMes(parsed);
    };
    reader.onerror = () => setErro('Não foi possível ler o arquivo.');
    reader.readAsText(file, 'utf-8');
  };

  const card = { background:'var(--card)', borderRadius:10, padding:'14px 16px', boxShadow:'0 1px 4px var(--shadow)', marginBottom:14 };
  const h = { fontWeight:700, fontSize:13, letterSpacing:.5, marginBottom:10, color:'var(--tx)' };
  const kpi = (label, value, sub) => (
    <div style={{ background:'var(--card)', borderRadius:10, padding:'12px 14px', boxShadow:'0 1px 4px var(--shadow)' }}>
      <div style={{ fontSize:11, color:'var(--tx3)', marginBottom:4 }}>{label}</div>
      <div style={{ fontSize:22, fontWeight:800, color:'var(--tx)' }}>{value}</div>
      {sub && <div style={{ fontSize:11, color:'var(--tx3)', marginTop:2 }}>{sub}</div>}
    </div>
  );
  const th = (label, k, right) => (
    <th onClick={() => setSortK(k)} style={{
      padding:'8px 10px', fontSize:11, color:'var(--tx3)', fontWeight:700, cursor:'pointer',
      textAlign: right ? 'right' : 'left', whiteSpace:'nowrap', userSelect:'none',
      borderBottom:'1px solid var(--soft)', position:'sticky', top:0, background:'var(--card)',
    }}>{label}{sort.k === k ? (sort.asc ? ' ▲' : ' ▼') : ''}</th>
  );
  const statusBadge = {
    synced:  { t:'Vendas sincronizadas ✓', b:'var(--ok-bg)', c:'var(--ok-tx)' },
    saving:  { t:'Salvando vendas...', b:'var(--warn-bg)', c:'var(--amber)' },
    error:   { t:'Erro ao salvar vendas ✗', b:'var(--err-bg)', c:'var(--err-tx)' },
    offline: { t:'Offline — dados locais', b:'var(--err-bg)', c:'var(--err-tx)' },
    loading: { t:'Carregando vendas...', b:'var(--box)', c:'var(--tx2)' },
    idle:    { t:'', b:'transparent', c:'var(--tx3)' },
  }[vendasStatus] || { t:'', b:'transparent', c:'var(--tx3)' };

  return (
    <div className="tab-content" style={{ padding:'12px 16px' }}>
      {/* Importação */}
      <div style={card}>
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:8 }}>
          <div style={h}>📥 IMPORTAR RELATÓRIO DE VENDAS</div>
          {statusBadge.t && (
            <span style={{ fontSize:11, fontWeight:600, padding:'2px 10px', borderRadius:20, background:statusBadge.b, color:statusBadge.c }}>
              {statusBadge.t}
            </span>
          )}
        </div>
        <div style={{ display:'flex', gap:8, alignItems:'center', flexWrap:'wrap' }}>
          <button onClick={() => fileRef.current && fileRef.current.click()} style={{
            padding:'10px 18px', borderRadius:8, fontSize:14, fontWeight:700,
            background:'var(--gold)', color:'var(--on-accent)',
          }}>📥 Selecionar arquivo (.xls)</button>
          <input ref={fileRef} type="file" accept=".xls,.html,.htm" style={{ display:'none' }} onChange={handleFile} />
          <span style={{ fontSize:12, color:'var(--tx3)' }}>
            Relatório "Vendas por Produto" exportado pelo sistema. O mês é detectado automaticamente pelo período do título.
          </span>
        </div>
        {erro && (
          <div style={{ marginTop:10, padding:'8px 12px', background:'var(--err-bg)', border:'1px solid var(--err-line)', borderRadius:8, fontSize:12, color:'var(--err-tx)' }}>
            ⚠️ {erro}
          </div>
        )}
        {temMeses && (
          <div style={{ marginTop:12, border:'1px solid var(--soft)', borderRadius:8, overflow:'hidden' }}>
            {mesesOrdenados(vendas).slice().reverse().map(m => {
              const d = vendas.meses[m];
              const fatM = (d.rows || []).reduce((s, r) => s + r.fat, 0);
              return (
                <div key={m} style={{ display:'flex', alignItems:'center', gap:10, padding:'8px 12px', borderBottom:'1px solid var(--line-soft)' }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <span style={{ fontSize:13, fontWeight:700, color:'var(--tx)' }}>{fmtMes(m)}</span>
                    <span style={{ fontSize:11, color:'var(--tx3)', marginLeft:8 }}>
                      {fmtData(d.de)} a {fmtData(d.ate)} · {(d.rows || []).length} produtos
                    </span>
                  </div>
                  <span style={{ fontSize:13, fontWeight:700, color:'var(--green)' }}>{fmt2(fatM)}</span>
                  <button onClick={() => setConfirmDel(m)} title="Excluir este mês" style={{ background:'transparent', fontSize:14 }}>🗑️</button>
                </div>
              );
            })}
          </div>
        )}
      </div>

      {!temMeses && (
        <div style={{ textAlign:'center', padding:'40px 20px', color:'var(--tx4)' }}>
          <div style={{ fontSize:40, marginBottom:8 }}>💰</div>
          <div>Nenhuma venda importada ainda. Importe o relatório mensal do sistema acima.</div>
        </div>
      )}

      {temMeses && (
        <div>
          {/* Filtro + KPIs */}
          <div style={{ ...card, display:'flex', alignItems:'center', justifyContent:'space-between', flexWrap:'wrap', gap:10 }}>
            <FiltroMeses vendas={vendas} filtro={filtro} setFiltro={setFiltro} />
            <span style={{ fontSize:12, color:'var(--tx3)' }}>{agg.meses.length} mês(es) no período</span>
          </div>
          <div className="kpi-row" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10, marginBottom:14 }}>
            {kpi('FATURAMENTO', fmt2(agg.fatTotal))}
            {kpi('ITENS VENDIDOS', agg.qtdTotal.toLocaleString('pt-BR'))}
            {kpi('PRODUTOS DISTINTOS', agg.porProduto.length)}
            {kpi('TICKET MÉDIO / ITEM', agg.qtdTotal > 0 ? fmt2(agg.fatTotal / agg.qtdTotal) : '—')}
          </div>

          {/* CMV real do período (produtos vinculados a fichas) */}
          {comCmv.length > 0 && (
            <div style={card}>
              <div style={h}>🧾 CMV REAL DO PERÍODO (vendas × custo das fichas)</div>
              <div className="kpi-row" style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
